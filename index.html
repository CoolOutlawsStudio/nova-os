  NOVA OS — a browser-based operating system in one self-contained HTML file.

  APP INSTALL API (postMessage) — any app window/iframe running inside the OS can use it:
    // Install or update an app (the user is asked to confirm in a dialog):
    window.parent.postMessage({type:'webos-install', app:{
        id:'my-app',            // required, [A-Za-z0-9_.-], max 80 chars; same id = update
        name:'My App',          // required, max 60 chars
        icon:'🚀',              // emoji/short text, or data:image/...;base64 URL
        description:'...', version:'1.0', author:'...',
        html:'<!doctype html>...'   // full HTML string (runs sandboxed, offline)
        // OR url:'https://...'     // a web app shown in a window
    }}, '*');
    // Reply to the sender:  {type:'webos-installed', id, ok:true|false, error?}
    //   followed by         {type:'webos-installed-list', apps:[{id,version}]}

    // List apps installed through this API:
    window.parent.postMessage({type:'webos-list-installed'}, '*');
    // Reply: {type:'webos-installed-list', apps:[{id, version}]}

    // Uninstall (user confirms):  {type:'webos-uninstall', id}  -> {type:'webos-uninstalled', id, ok}

  Legacy Appetite messages are also accepted:
    {source:'appetite', type:'install-app'|'open-app'|'publish-app', app:{id,name,emoji,color,author,category,description,html}}
    install-app -> confirm + install (emoji = icon); open-app -> open html in a sandboxed window (not installed);
    publish-app -> toast only.

<title>Nova OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8C%3C/text%3E%3C/svg%3E">
<style>
:root{--accent:#4f8cff;--radius:12px;--icon:56px;--alpha:.78;--tb:50px;--font:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
[data-theme=dark]{--fg:#eef1f7;--muted:#9aa3b5;--win:rgba(30,32,42,var(--alpha));--body:rgba(22,24,32,.92);--panel:rgba(18,20,28,var(--alpha));--border:rgba(255,255,255,.10);--hover:rgba(255,255,255,.08);--input:rgba(255,255,255,.07);--card:rgba(255,255,255,.05);--shadow:0 24px 70px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3);color-scheme:dark}
[data-theme=light]{--fg:#1b1e27;--muted:#5d6577;--win:rgba(250,251,254,var(--alpha));--body:rgba(255,255,255,.94);--panel:rgba(245,247,252,var(--alpha));--border:rgba(0,0,0,.10);--hover:rgba(0,0,0,.06);--input:rgba(0,0,0,.05);--card:rgba(0,0,0,.035);--shadow:0 24px 70px rgba(0,0,0,.25),0 2px 8px rgba(0,0,0,.12);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:var(--font);color:var(--fg);font-size:14px;background:#000}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(128,128,128,.4);border-radius:10px;border:2px solid transparent;background-clip:content-box}
#wall{position:fixed;inset:0;background-size:cover!important;background-position:center!important;transition:background .6s}
.glass{background:var(--win);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}
body.noblur .glass{-webkit-backdrop-filter:none;backdrop-filter:none}
body.noanim *{transition:none!important;animation:none!important}
#desk{position:fixed;left:0;right:0;top:0;bottom:var(--tb)}
body.tb-top #desk{top:var(--tb);bottom:0}
body.tb-left #desk{left:var(--tb);bottom:0}
#icons{position:absolute;inset:0;padding:12px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,calc(var(--icon) + 46px));grid-auto-columns:calc(var(--icon) + 36px);gap:4px;align-content:start;justify-content:start}
.dicon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 4px;border-radius:10px;user-select:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);border:1px solid transparent;cursor:default;outline:none}
.dicon:hover{background:rgba(255,255,255,.12)}
.dicon.sel{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3)}
.dicon .lbl{font-size:12px;text-align:center;line-height:1.2;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
body.nolabels .dicon .lbl{display:none}
.tile{width:var(--icon);height:var(--icon);flex:none;border-radius:calc(var(--icon)*.26);display:grid;place-items:center;font-size:calc(var(--icon)*.52);line-height:1;background:linear-gradient(135deg,var(--c1,#5b8cff),var(--c2,#7b4dff));box-shadow:0 4px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35);text-shadow:none;color:#fff;font-weight:700;overflow:hidden}
.tile.sm{--icon:22px;border-radius:6px;box-shadow:none}
.tile.md{--icon:40px}
.tile.lg{--icon:64px}
.tile img{width:100%;height:100%;object-fit:cover}
.tile.art{background:none;box-shadow:none;overflow:visible}
.tile.art img{object-fit:contain;transform:scale(1.12);filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
.oslogo{width:96px;height:96px;filter:drop-shadow(0 0 30px rgba(124,92,255,.7))}
#lock .llogo{width:56px;height:56px;display:block;margin:0 auto 6px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4))}
#windows{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#windows>*{pointer-events:auto}
.win{position:absolute;display:flex;flex-direction:column;border-radius:var(--radius);overflow:visible;box-shadow:var(--shadow);border:1px solid var(--border);min-width:240px;min-height:150px;animation:winIn .18s ease-out}
@keyframes winIn{from{opacity:0;transform:scale(.96) translateY(8px)}}
.win.closing{animation:winOut .14s ease-in forwards}
@keyframes winOut{to{opacity:0;transform:scale(.95)}}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border:0}
.win.min{display:none}
.win.anim{transition:left .18s,top .18s,width .18s,height .18s}
.titlebar{border-radius:var(--radius) var(--radius) 0 0;height:40px;display:flex;align-items:center;padding:0 4px 0 12px;gap:9px;flex:none;user-select:none;touch-action:none}
.win:not(.active) .titlebar{opacity:.65}
.wtitle{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13px}
.wbtns{display:flex;gap:2px}
.wbtns button{width:36px;height:30px;border:0;background:none;border-radius:7px;cursor:pointer;font-size:13px;display:grid;place-items:center}
.wbtns button:hover{background:var(--hover)}
.wbtns .x:hover{background:#e5484d;color:#fff}
.wbody{border-radius:0 0 var(--radius) var(--radius);flex:1;position:relative;overflow:auto;background:var(--body);display:flex;flex-direction:column;min-height:0}
.rz{position:absolute;z-index:5;touch-action:none;border:0;border-radius:0;box-shadow:none;padding:0;margin:0} /* .rz.sw must not pick up the accent-swatch .sw style */
.rz.n{top:-5px;left:12px;right:12px;height:10px;cursor:ns-resize}.rz.s{bottom:-5px;left:12px;right:12px;height:10px;cursor:ns-resize}
.rz.e{right:-5px;top:12px;bottom:12px;width:10px;cursor:ew-resize}.rz.w{left:-5px;top:12px;bottom:12px;width:10px;cursor:ew-resize}
.rz.ne,.rz.nw,.rz.se,.rz.sw{width:18px;height:18px;z-index:6}
.rz.ne{right:-6px;top:-6px;cursor:nesw-resize}.rz.sw{left:-6px;bottom:-6px;cursor:nesw-resize}
.rz.nw{left:-6px;top:-6px;cursor:nwse-resize}.rz.se{right:-6px;bottom:-6px;cursor:nwse-resize}
@media (pointer:coarse){.rz.n,.rz.s{height:20px}.rz.n{top:-10px}.rz.s{bottom:-10px}.rz.e,.rz.w{width:20px}.rz.e{right:-10px}.rz.w{left:-10px}.rz.ne,.rz.nw,.rz.se,.rz.sw{width:30px;height:30px}.rz.ne,.rz.nw{top:-12px}.rz.se,.rz.sw{bottom:-12px}.rz.ne,.rz.se{right:-12px}.rz.nw,.rz.sw{left:-12px}}
.win.max .titlebar,.win.max .wbody{border-radius:0}
.win.max .rz{display:none}
body.dragging iframe{pointer-events:none}
body.dragging{user-select:none}
#snap{position:absolute;inset:6px;border-radius:var(--radius);background:rgba(255,255,255,.12);border:2px solid var(--accent);display:none;pointer-events:none;z-index:99998}
/* taskbar */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);display:flex;align-items:center;gap:4px;padding:0 8px;z-index:9000;border-top:1px solid var(--border);background:var(--panel)}
body.tb-top #taskbar{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--border)}
body.tb-left #taskbar{top:0;bottom:0;right:auto;width:var(--tb);height:auto;flex-direction:column;padding:8px 0;border-top:0;border-right:1px solid var(--border)}
#tasks{flex:1;display:flex;align-items:center;gap:3px;overflow:hidden;min-width:0}
body.tb-center:not(.tb-left) #tasks{justify-content:center}
body.tb-left #tasks{flex-direction:column;width:100%}
.tbtn{height:calc(var(--tb) - 10px);min-width:calc(var(--tb) - 10px);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px;border-radius:9px;border:0;background:none;cursor:pointer;max-width:190px;position:relative;flex:none}
.tbtn:hover{background:var(--hover)}
.tbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tbtn.running::after{content:"";position:absolute;bottom:2px;left:50%;width:6px;height:3px;margin-left:-3px;border-radius:3px;background:var(--muted)}
.tbtn.active{background:var(--hover)}
.tbtn.active::after{width:16px;margin-left:-8px;background:var(--accent)}
body.tb-left .tbtn span{display:none}
body.tb-left .tbtn{max-width:none;padding:0}
body.tb-left .tbtn.running::after{bottom:auto;left:2px;top:50%;width:3px;height:6px;margin:-3px 0 0}
body.tb-left .tbtn.active::after{height:16px;margin-top:-8px}
#startbtn .tile{background:linear-gradient(135deg,var(--accent),#b04dff)}
.tsep{width:1px;height:24px;background:var(--border);margin:0 4px;flex:none}
body.tb-left .tsep{width:24px;height:1px;margin:4px 0}
#tray{display:flex;align-items:center;gap:2px;flex:none}
body.tb-left #tray{flex-direction:column}
#clock{text-align:right;font-size:12px;line-height:1.25;padding:0 10px;height:calc(var(--tb) - 10px);display:flex;flex-direction:column;justify-content:center;border-radius:9px;cursor:pointer;white-space:nowrap}
body.tb-left #clock{padding:4px;text-align:center;font-size:11px}
#clock:hover,.trayi:hover{background:var(--hover)}
.trayi{padding:6px 8px;border-radius:8px;cursor:pointer;font-size:15px}
/* popups */

/* ---- accounts: sign-in screen (Kai's mockup), tray avatar, profile menu ---- */
#acct{position:fixed;inset:0;z-index:65000;display:grid;place-items:center;color:#fff;overflow:auto;animation:fade .2s;font-family:inherit;-webkit-text-size-adjust:100%}
#acct.out{opacity:0;transition:opacity .25s}
#acct .acct-bg{position:fixed;inset:0;background:rgba(5,6,12,.55);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}
#acct.boot .acct-bg{background:radial-gradient(40% 45% at 24% 36%,rgba(20,120,140,.55),transparent 70%),radial-gradient(38% 40% at 74% 52%,rgba(110,60,190,.5),transparent 70%),radial-gradient(45% 35% at 50% 100%,rgba(30,110,90,.35),transparent 70%),#0a0a16}
#acct .acct-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;padding:max(28px,var(--sat)) 16px max(24px,var(--sab));width:100%;box-sizing:border-box}
#acct .acct-time{text-align:center;text-shadow:0 2px 20px rgba(0,0,0,.35)}
#acct .acct-clock{font-size:clamp(48px,9vw,64px);font-weight:300;letter-spacing:1px;line-height:1.05}
#acct .acct-date{font-size:16px;opacity:.85;margin-top:4px}
#acct .acct-card{width:min(256px + 4vw,340px);max-width:100%;box-sizing:border-box;padding:24px 26px 16px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.28);
 box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);display:flex;flex-direction:column;align-items:stretch;text-align:center}
#acct .acct-card.busy{opacity:.85;pointer-events:none}
#acct .acct-logo{width:52px;height:52px;margin:0 auto 10px;border-radius:14px;display:grid;place-items:center;font-size:30px;overflow:hidden}
#acct .acct-logo img{width:100%;height:100%}
#acct h1{font-size:22px;font-weight:700;margin:0}
#acct .acct-sub{margin:6px 0 16px;font-size:12.5px;opacity:.85}
#acct .acct-form{display:flex;flex-direction:column;gap:9px}
#acct .acct-in{font:inherit;font-size:16px;padding:9px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.88);color:#111827;outline:none;min-width:0}
#acct .acct-in::placeholder{color:#6b7280}
#acct .acct-in:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.35)}
#acct .acct-go{font:inherit;font-weight:700;font-size:15px;margin-top:3px;padding:10px;border:0;border-radius:9px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#7c5cff,#22d3ee);box-shadow:0 6px 20px rgba(80,120,255,.35)}
#acct .acct-go:hover{filter:brightness(1.08)}#acct .acct-go:focus-visible{outline:2px solid #fff;outline-offset:2px}
#acct .acct-msg{font-size:12.5px;line-height:1.4;margin-top:9px;color:#fecaca;min-height:0}
#acct .acct-msg.ok{color:#bbf7d0}#acct .acct-msg.empty{margin:0}
#acct .acct-row{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
#acct .acct-link{font:inherit;font-size:12px;color:#fff;opacity:.9;background:none;border:0;padding:4px 0;cursor:pointer}
#acct .acct-link:hover{opacity:1;text-decoration:underline}
#acct .acct-link.small{font-size:11.5px;opacity:.7;margin-top:2px}
#acct .acct-link.guest{margin-top:6px}
#acct .acct-recent{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:-6px 0 12px}
#acct .acct-chip{display:flex;align-items:center;gap:6px;font:inherit;font-size:12px;color:#fff;padding:3px 10px 3px 3px;border-radius:99px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);cursor:pointer;max-width:100%}
#acct .acct-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html.touch #acct .acct-link{padding:10px 4px}html.touch #acct .acct-go{padding:13px}
.avatar.av-art{background:none}.avatar.av-art img{width:100%;height:100%;display:block}
.avatar.xs{width:22px;height:22px;font-size:13px}.avatar.sm{width:24px;height:24px;font-size:14px}.avatar.lg2{width:52px;height:52px;font-size:28px}
.avatar.guest{background:linear-gradient(135deg,#64748b,#334155)}
.sm-foot .avatar.clickable{cursor:pointer}
#acctbtn{padding:0 4px}#syncind{font-size:14px}#syncind[hidden]{display:none}
#acctpop{right:8px;bottom:calc(var(--tb) + 8px + var(--sab));width:280px;padding:10px;display:flex;flex-direction:column;gap:2px}
body.tb-top #acctpop{top:calc(var(--tb) + 8px);bottom:auto}
#acctpop .acct-head{display:flex;gap:12px;align-items:center;padding:6px 6px 10px}
#acctpop .acct-name{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#acctpop .acct-email{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#acctpop .acct-sync{font-size:12px;padding:0 8px 8px;border-bottom:1px solid var(--border);margin-bottom:4px}
#acctpop .acct-item{display:flex;gap:10px;align-items:center;text-align:left;padding:8px;border:0;background:none;color:inherit;font:inherit;border-radius:8px;cursor:pointer}
#acctpop .acct-item:hover{background:var(--hover)}#acctpop .acct-item.danger{color:#f87171}
#acctpop .ai{width:22px;text-align:center}
.acct-avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.acct-av{padding:3px;border-radius:50%;border:2px solid transparent;background:none;cursor:pointer;display:grid;place-items:center}
.acct-av .avatar{width:40px;height:40px}.acct-av.on{border-color:var(--accent)}
.acct-test.good{color:#22c55e}.acct-test.bad{color:#f87171}.acct-test{font-size:13px;margin:4px 0 0}
body.phone #acctpop{left:8px;right:8px;width:auto}
</style>

const GROOVE_HTML="<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Groove — Music Player<\/title>\n<meta name=\"description\" content=\"Offline music player with playlist, visualizer, ID3 tags and cover art.\">\n<link rel=\"icon\" href=\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff7a59'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M26 44a6 6 0 1 1-4-5.6V18l22-5v24a6 6 0 1 1-4-5.6V20l-14 3.2z' fill='white'/%3E%3C/svg%3E\">\n<style>\n:root{\n  --bg:#0d0f1a; --bg2:#151a2e; --card:rgba(255,255,255,.06); --card-b:rgba(255,255,255,.10);\n  --text:#eef0ff; --muted:#9aa0c3; --dim:#646a8f;\n  --a1:#ff7a59; --a2:#8b5cf6; --a3:#22d3ee;\n  --grad:linear-gradient(135deg,var(--a1),var(--a2));\n  --r:20px; --shadow:0 10px 40px rgba(0,0,0,.35);\n}\n*{box-sizing:border-box}\nhtml,body{height:100%;margin:0}\nbody{\n  font:14px/1.45 system-ui,-apple-system,\"Segoe UI\",Roboto,Ubuntu,\"Helvetica Neue\",Arial,sans-serif;\n  color:var(--text); background:var(--bg); overflow-x:hidden;\n  background-image:\n    radial-gradient(900px 600px at 10% -10%,rgba(139,92,246,.25),transparent 60%),\n    radial-gradient(800px 600px at 110% 10%,rgba(255,122,89,.18),transparent 60%),\n    radial-gradient(700px 500px at 50% 120%,rgba(34,211,238,.12),transparent 60%);\n  background-attachment:fixed;\n  -webkit-user-select:none; user-select:none;\n}\nbutton{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}\nbutton:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--a3);outline-offset:2px}\nsvg{display:block}\n.app{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:auto 1fr;align-content:start;min-height:100%}\nheader.top{grid-column:1/-1;display:flex;align-items:center;gap:10px}\n.logo{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 4px 18px rgba(255,122,89,.35)}\n.brand{font-weight:750;font-size:18px;letter-spacing:.2px}\n.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0}\n.top .spacer{flex:1}\n.card{background:var(--card);border:1px solid var(--card-b);border-radius:var(--r);box-shadow:var(--shadow);\n  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);}\n/* Now playing */\n.now{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}\n.hero{display:flex;gap:16px;align-items:center;min-width:0}\n.cover{flex:none;width:132px;height:132px;border-radius:18px;background:var(--grad);position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}\n.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}\n.cover.has-art img{display:block}\n.cover .note{position:absolute;inset:0;display:grid;place-items:center;opacity:.9}\n.cover.has-art .note{display:none}\n.cover.playing{animation:breathe 2.4s ease-in-out infinite}\n@keyframes breathe{50%{transform:scale(1.025)}}\n.meta{min-width:0;flex:1}\n.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--a1);font-weight:700}\n.title{font-size:22px;font-weight:750;line-height:1.2;margin:4px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.artist{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.album{color:var(--dim);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.viz-wrap{position:relative;height:120px;border-radius:16px;overflow:hidden;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.05);cursor:pointer}\n.viz-wrap canvas{width:100%;height:100%;display:block}\n.viz-mode{position:absolute;right:8px;top:8px;font-size:11px;color:var(--muted);background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px;pointer-events:none}\n.seek{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}\n.seek span{min-width:42px;text-align:center}\ninput[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;--p:0%;margin:0}\ninput[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2)) 0/var(--p) 100% no-repeat,rgba(255,255,255,.12)}\ninput[type=range]::-moz-range-track{height:6px;border-radius:99px;background:rgba(255,255,255,.12)}\ninput[type=range]::-moz-range-progress{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2))}\ninput[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .15s}\ninput[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}\ninput[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15)}\ninput[type=range]:disabled{opacity:.45;cursor:default}\n.controls{display:flex;align-items:center;justify-content:center;gap:10px}\n.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s,transform .1s;position:relative}\n.ib:hover{background:rgba(255,255,255,.08);color:var(--text)}\n.ib:active{transform:scale(.94)}\n.ib.on{color:var(--a1)}\n.ib.on::after{content:\"\";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--a1)}\n.ib .badge{position:absolute;top:6px;right:5px;font-size:9px;font-weight:800;color:var(--a1)}\n.play{width:62px;height:62px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 8px 26px rgba(255,122,89,.4);transition:transform .12s,box-shadow .2s}\n.play:hover{box-shadow:0 10px 34px rgba(139,92,246,.5)}\n.play:active{transform:scale(.94)}\n.vol{display:flex;align-items:center;gap:8px;max-width:260px;margin:0 auto;width:100%}\n.vol .ib{width:36px;height:36px;flex:none}\n.hint{font-size:11.5px;color:var(--dim);text-align:center}\nkbd{font:inherit;font-size:10.5px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:var(--muted)}\n/* Playlist */\n.list{padding:14px;display:flex;flex-direction:column;min-width:0;min-height:420px}\n.list-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}\n.list-head h2{font-size:16px;margin:0 6px 0 2px}\n.count{color:var(--muted);font-size:12px;margin-right:auto}\n.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);font-size:13px;font-weight:600;transition:background .15s}\n.btn:hover{background:rgba(255,255,255,.13)}\n.btn.primary{background:var(--grad);border-color:transparent;color:#fff}\n.btn.primary:hover{filter:brightness(1.08)}\n.btn.small{padding:6px 10px;font-size:12px}\n.tracks{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:0;max-height:calc(100vh - 170px);border-radius:14px;position:relative}\n.tracks::-webkit-scrollbar{width:8px}.tracks::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}\n.tr{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 4px;border-radius:12px;cursor:default;transition:background .12s;position:relative}\n.tr:hover{background:rgba(255,255,255,.05)}\n.tr.sel{background:rgba(255,255,255,.08)}\n.tr.current{background:linear-gradient(90deg,rgba(255,122,89,.18),rgba(139,92,246,.14));}\n.tr.current .t-title{color:#fff}\n.tr.missing{opacity:.5}\n.tr.err .t-title{text-decoration:line-through;color:var(--dim)}\n.tr.dragging{opacity:.85;background:rgba(139,92,246,.25);box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:2}\n.handle{flex:none;width:22px;height:34px;display:grid;place-items:center;color:var(--dim);cursor:grab;touch-action:none}\n.handle:active{cursor:grabbing}\n.num{flex:none;width:26px;text-align:center;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}\n.thumb{flex:none;width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,rgba(255,122,89,.5),rgba(139,92,246,.5));background-size:cover;background-position:center;display:grid;place-items:center}\n.t-meta{min-width:0;flex:1}\n.t-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.t-sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.t-dur{flex:none;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}\n.t-rm{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--dim);opacity:0;transition:opacity .12s,background .12s}\n.tr:hover .t-rm,.tr.sel .t-rm{opacity:1}\n.t-rm:hover{background:rgba(255,80,80,.15);color:#ff8a8a}\n.eq{display:none;gap:2px;align-items:flex-end;height:14px}\n.tr.current .eq{display:flex}.tr.current .num-txt{display:none}\n.eq i{width:3px;background:var(--a1);border-radius:2px;height:4px}\n.playing-now .tr.current .eq i{animation:eq .9s ease-in-out infinite}\n.eq i:nth-child(2){animation-delay:-.3s!important}.eq i:nth-child(3){animation-delay:-.6s!important}\n@keyframes eq{0%,100%{height:3px}50%{height:14px}}\n.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;border:2px dashed rgba(255,255,255,.12);border-radius:16px;padding:28px 16px;color:var(--muted)}\n.empty .big{width:64px;height:64px;border-radius:20px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 26px rgba(139,92,246,.35)}\n.empty h3{margin:4px 0 0;color:var(--text);font-size:16px}\n.empty p{margin:0;font-size:13px}\n/* drop overlay */\n.drop{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(13,15,26,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}\n.drop.show{display:grid}\n.drop div{padding:36px 44px;border-radius:24px;border:2px dashed var(--a1);text-align:center;font-size:18px;font-weight:700;background:rgba(255,255,255,.04)}\n.drop small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:6px}\n/* toast */\n.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none;width:max-content;max-width:92vw}\n.toast{background:rgba(25,28,48,.95);border:1px solid var(--card-b);padding:10px 16px;border-radius:14px;box-shadow:var(--shadow);font-size:13px;animation:tin .25s ease}\n@keyframes tin{from{opacity:0;transform:translateY(8px)}}\n/* modal */\n.modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(5,6,12,.6);padding:16px}\n.modal.show{display:grid}\n.sheet{width:min(560px,100%);padding:18px;display:flex;flex-direction:column;gap:12px;background:rgba(24,27,46,.97)}\n.sheet h3{margin:0;font-size:17px}\n.sheet p{margin:0;color:var(--muted);font-size:13px}\n.seg{display:inline-flex;background:rgba(255,255,255,.06);border-radius:12px;padding:3px;gap:3px}\n.seg button{padding:6px 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}\n.seg button.on{background:rgba(255,255,255,.14);color:var(--text)}\ntextarea{width:100%;height:200px;resize:vertical;border-radius:12px;border:1px solid var(--card-b);background:rgba(0,0,0,.3);color:var(--text);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:10px;-webkit-user-select:text;user-select:text}\n.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n/* responsive */\n@media (max-width:820px){\n  .app{grid-template-columns:1fr;padding:12px;gap:12px}\n  .tracks{max-height:none}\n  .list{min-height:300px}\n}\n@media (max-width:480px){\n  .cover{width:96px;height:96px;border-radius:14px}\n  .title{font-size:18px}\n  .now{padding:14px}\n  .viz-wrap{height:90px}\n  .controls{gap:4px}\n  .ib{width:40px;height:40px}\n  .play{width:56px;height:56px}\n  .hint{display:none}\n  .btn .lbl{display:none}\n  .btn{padding:8px 10px}\n  .brand small{display:none}\n  .t-rm{opacity:1}\n}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\" id=\"app\">\n  <header class=\"top\">\n    <div class=\"logo\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"#fff\"><path d=\"M9 18.5a3 3 0 1 1-2-2.83V6l12-2.5v12a3 3 0 1 1-2-2.83V8.1L9 9.8z\"/><\/svg><\/div>\n    <div class=\"brand\">Groove<small>Your local music, beautifully played<\/small><\/div>\n    <div class=\"spacer\"><\/div>\n    <button class=\"btn small\" id=\"helpBtn\" title=\"Keyboard shortcuts\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"2\" y=\"6\" width=\"20\" height=\"12\" rx=\"2\"/><path d=\"M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10\"/><\/svg><span class=\"lbl\">Shortcuts<\/span><\/button>\n  <\/header>\n\n  <section class=\"card now\" aria-label=\"Now playing\">\n    <div class=\"hero\">\n      <div class=\"cover\" id=\"cover\"><img id=\"coverImg\" alt=\"\"><div class=\"note\"><svg width=\"54\" height=\"54\" viewBox=\"0 0 24 24\" fill=\"rgba(255,255,255,.9)\"><path d=\"M9 18.5a3 3 0 1 1-2-2.83V6l12-2.5v12a3 3 0 1 1-2-2.83V8.1L9 9.8z\"/><\/svg><\/div><\/div>\n      <div class=\"meta\">\n        <div class=\"eyebrow\" id=\"status\">Ready<\/div>\n        <div class=\"title\" id=\"title\">Nothing playing<\/div>\n        <div class=\"artist\" id=\"artist\">Add some music to get  0 1-4 4H3\"/><\/svg><span class=\"badge\" id=\"repeatBadge\"><\/span><\/button>\n    <\/div>\n    <div class=\"vol\">\n      <button class=\"ib\" id=\"muteBtn\" title=\"Mute (M)\" aria-label=\"Mute\"><svg id=\"volIco\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/svg><\/button>\n      <input type=\"range\" id=\"vol\" min=\"0\" max=\"100\" value=\"80\" aria-label=\"Volume\">\n    <\/div>\n    <div class=\"hint\"><kbd>Space<\/kbd> play · <kbd>←<\/kbd><kbd>→<\/kbd> seek · <kbd>Shift<\/kbd>+<kbd>←<\/kbd><kbd>→<\/kbd> track · <kbd>↑<\/kbd><kbd>↓<\/kbd> volume · <kbd>M<\/kbd> mute<\/div>\n  <\/section>\n\n  <section class=\"card list\" aria-label=\"Playlist\" id=\"listCard\">\n    <div class=\"list-head\">\n      <h2>Playlist<\/h2><span class=\"count\" id=\"count\">0 tracks<\/span>\n      <button class=\"btn primary small\" id=\"addBtn\" title=\"Add audio files\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg><span class=\"lbl\">Add<\/span><\/button>\n      <button class=\"btn small\" id=\"importBtn\" title=\"Import playlist (.json / .m3u)\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v12M7 10l5 5 5-5M5 21h14\"/><\/svg><span class=\"lbl\">Import<\/span><\/button>\n      <button class=\"btn small\" id=\"exportBtn\" title=\"Export playlist\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 15V3M7 8l5-5 5 5M5 21h14\"/><\/svg><span class=\"lbl\">Export<\/span><\/button>\n      <button class=\"btn small\" id=\"clearBtn\" title=\"Clear playlist\" aria-label=\"Clear playlist\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14\"/><\/svg><\/button>\n    <\/div>\n    <ul class=\"tracks\" id=\"tracks\" role=\"listbox\" aria-label=\"Tracks\"><\/ul>\n    <div class=\"empty\" id=\"empty\">\n      <div class=\"big\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"#fff\"><path d=\"M9 18.5a3 3 0 1 1-2-2.83V6l12-2.5v12a3 3 0 1 1-2-2.83V8.1L9 9.8z\"/><\/svg><\/div>\n      <h3>Drop music here<\/h3>\n      <p>MP3, WAV, OGG, M4A/AAC, FLAC (whatever your browser supports).<br>Your files never leave this device.<\/p>\n      <button class=\"btn primary\" id=\"addBtn2\">Choose files<\/button>\n    <\/div>\n  <\/section>\n<\/div>\n\n<input type=\"file\" id=\"fileIn\" class=\"sr\" multiple accept=\"audio/*,.mp3,.wav,.ogg,.oga,.opus,.m4a,.aac,.mp4,.flac,.weba,.webm\" tabindex=\"-1\" aria-hidden=\"true\">\n<input type=\"file\" id=\"plIn\" class=\"sr\" accept=\".json,.m3u,.m3u8,application/json,audio/x-mpegurl,text/plain\" tabindex=\"-1\" aria-hidden=\"true\">\n<audio id=\"audio\" preload=\"metadata\"><\/audio>\n\n<div class=\"drop\" id=\"drop\"><div>Drop to add to playlist<small>Audio files or a .json / .m3u playlist<\/small><\/div><\/div>\n<div class=\"toasts\" id=\"toasts\" aria-live=\"polite\"><\/div>\n\n<div class=\"modal\" id=\"exportModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"exTitle\">\n  <div class=\"card sheet\">\n    <h3 id=\"exTitle\">Export playlist<\/h3>\n    <div class=\"seg\" id=\"exFmt\"><button data-f=\"json\" class=\"on\">JSON<\/button><button data-f=\"m3u\">M3U<\/button><\/div>\n    <p id=\"exNote\">Saves track names and order. Audio files aren't included. When you import later, add the same files again and they'll be matched by name.<\/p>\n    <textarea id=\"exText\" readonly spellcheck=\"false\"><\/textarea>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"exClose\">Close<\/button>\n      <button class=\"btn\" id=\"exCopy\">Copy<\/button>\n      <button class=\"btn primary\" id=\"exSave\">Download file<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"modal\" id=\"helpModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"hTitle\">\n  <div class=\"card sheet\">\n    <h3 id=\"hTitle\">Keyboard shortcuts<\/h3>\n    <p>\n      <kbd>Space<\/kbd> Play / pause<br>\n      <kbd>←<\/kbd> / <kbd>→<\/kbd> Seek 5 seconds<br>\n      <kbd>Shift<\/kbd>+<kbd>←<\/kbd> / <kbd>→<\/kbd> or <kbd>P<\/kbd> / <kbd>N<\/kbd> Previous / next track<br>\n      <kbd>↑<\/kbd> / <kbd>↓<\/kbd> Volume<br>\n      <kbd>M<\/kbd> Mute &nbsp; <kbd>S<\/kbd> Shuffle &nbsp; <kbd>R<\/kbd> Repeat mode &nbsp; <kbd>V<\/kbd> Visualizer style<br>\n      <kbd>Enter<\/kbd> Play selected &nbsp; <kbd>Delete<\/kbd> Remove selected<br>\n      <kbd>Alt<\/kbd>+<kbd>↑<\/kbd> / <kbd>↓<\/kbd> Move selected track\n    <\/p>\n    <p>You can double-click a track to play it, and drag the ⋮⋮ handle to reorder.<\/p>\n    <div class=\"row\"><button class=\"btn primary\" id=\"hClose\">Got it<\/button><\/div>\n  <\/div>\n<\/div>\n\n<script>\n(function(){\n'use strict';\nconst $ = id => document.getElementById(id);\nconst audio = $('audio');\n\n/* ---------- safe storage (sandbox may block it) ---------- */\nconst store = (() => {\n  let ls = null;\n  try { ls = window.localStorage; const k='__groove_t'; ls.setItem(k,'1'); ls.removeItem(k); } catch(e){ ls = null; }\n  return {\n    ok: !!ls,\n    get(k, d){ try { const v = ls && ls.getItem('groove.'+k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },\n    set(k, v){ try { ls && ls.setItem('groove.'+k, JSON.stringify(v)); } catch(e){} }\n  };\n})();\nconst opaqueOrigin = (() => { try { return window.origin === 'null' || location.origin === 'null'; } catch(e){ return true; } })();\n\n/* ---------- state ---------- */\nconst S = {\n  tracks: [],          // {id,file,name,title,artist,album,duration,cov   const CDN_DEFAULT = 'https://esm.sh/@supabase/supabase-js@2.109.0';

  const BUCKET = 'nova-files';
  const INLINE_MAX = 128 * 1024;            // text up to 128 KB is stored inline in files.content
  const MAX_FILE = 20 * 1024 * 1024;        // bucket cap, same as the OS file bridge (FS_API.maxWrite)
  const QUEUE_MAX_BYTES = 2 * 1024 * 1024;  // offline queue cap (localStorage is small)
  const SETTINGS_DEBOUNCE = 800;
  // cfg keys that never leave the device: the local lock-screen password, and per-device file-access grants
  const LOCAL_ONLY_KEYS = ['pass', 'fsGrants'];

  class OfflineError extends Error { constructor(m) { super(m || 'offline'); this.name = 'OfflineError'; this.offline = true; } }

  const S = {
    sb: null, user: null, opts: null, listeners: new Set(), statusListeners: new Set(),
    settingsTimer: null, pendingSettings: null, settingsWaiters: [], flushing: false, fsSnap: null, channel: null,
  };

  // ---------- small helpers ----------
  const now = () => Date.now();
  const isBrowserOnline = () => !(typeof navigator !== 'undefined' && navigator.onLine === false);
  function isNetworkError(e) {
    if (!e) return false;
    if (e instanceof OfflineError) return true;
    const m = String(e.message || e.error_description || e).toLowerCase();
    return !isBrowserOnline() || e.name === 'TypeError' && /fetch|network|load failed/.test(m) ||
      /failed to fetch|networkerror|network request failed|load failed|fetch failed|err_internet_disconnected|timeout/.test(m) ||
      e.status === 0 || (e.status >= 502 && e.status <= 504);
  }
  function setStatus(s, detail) { for (const f of S.statusListeners) { try { f(s, detail); } catch (_) {} } }
  function need() { if (!S.sb) throw new Error('NovaCloud.init() has not been called'); }
  function uid() { need(); if (!S.user) throw new Error('Not signed in'); return S.user.id; }
  async function run(p) { // unwrap a supabase {data,error} promise
    let r; try { r = await p; } catch (e) { if (isNetworkError(e)) throw new OfflineError(e.message); throw e; }
    if (r && r.error) { const e = r.error; if (isNetworkError(e)) throw new OfflineError(e.message); const err = new Error(e.message || String(e)); err.code = e.code; err.status = e.status; err.cause = e; throw err; }
    return r ? r.data : r;
  }
  function normPath(p) {
    const parts = [];
    for (const s of String(p || '').split('/')) { if (!s || s === '.') continue; if (s === '..') parts.pop(); else parts.push(s); }
    return '/' + parts.join('/');
  }
  const baseName = p => normPath(p).split('/').pop() || '/';
  const escLike = s => s.replace(/[\\%_]/g, c => '\\' + c);
  const byteLen = s => (typeof TextEncoder !== 'undefined' ? new TextEncoder().encode(s).length : unescape(encodeURIComponent(s)).length);
  const uuid = () => (root.crypto && root.crypto.randomUUID ? root.crypto.randomUUID() :
    'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
  function looksSecret(key) {
    if (/^sb_secret_/i.test(key)) return true;
    const parts = String(key).split('.');
    if (parts.length === 3) {
      try { const json = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/'))); return json.role === 'service_role'; } catch (_) {}
    }
    return false;
  }
  function dataUrlToBlob(s) {
    const m = /^data:([^;,]*)(;base64)?,(.*)$/s.exec(s); if (!m) return null;
    const mime = m[1] || 'application/octet-stream';
    let bytes;
    if (m[2]) { const bin = atob(m[3]); bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); }
    else bytes = new TextEncoder().encode(decodeURIComponent(m[3]));
    return new Blob([bytes], { type: mime });
  }
  async function blobToDataUrl(b) {
    const buf = new Uint8Array(await b.arrayBuffer()); let bin = '';
    for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return 'data:' + (b.type || 'application/octet-stream') + ';base64,' + btoa(bin);
  }
  const isTextMime = m => !m || /^text\/|json|xml|javascript|svg/.test(m);
  function guessMime(name) {
    const e = (name.split('.').pop() || '').toLowerCase();
    return ({ txt: 'text/plain', md: 'text/markdown', html: 'text/html', htm: 'text/html', css: 'text/css', js: 'text/javascript', json: 'application/json',
      csv: 'text/csv', svg: 'image/svg+xml', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp',
      mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg', mp4: 'video/mp4', pdf: 'application/pdf' })[e] || null;
  }

  // ---------- offline queue (per user, localStorage, coalesced) ----------
  const qKey = () => 'nova-cloud-queue:' + (S.user ? S.user.id : 'none');
  function qLoad() { try { return JSON.parse(localStorage.getItem(qKey()) || '[]'); } catch (_) { return []; } }
  function qSave(q) {
    try { const s = JSON.stringify(q); if (s.length > QUEUE_MAX_BYTES) throw new Error('queue too big'); localStorage.setItem(qKey(), s); return true; }
    catch (e) { setStatus('error', { reason: 'offline-queue-full', error: e }); return false; }
  }
  function enqueue(op) {
    const q = qLoad();
    const same = o => o.kind === op.kind && (op.kind === 'settings' || o.key === op.key);
    const kept = q.filter(o => !same(o));                       // newest write for the same target wins
    if (op.kind === 'deletePath') for (let i = kept.length - 1; i >= 0; i--) { // a delete supersedes queued writes under it
      const k = kept[i]; if ((k.kind === 'writeFile' || k.kind === 'mkdir') && (k.key === op.key || k.key.startsWith(op.key + '/'))) kept.splice(i, 1);
    }
    kept.push(op);
    const ok = qSave(kept); setStatus('offline', { queued: kept.length });
    return { ok: false, queued: ok };
  }
  async function attempt(op, fn) {
    if (!isBrowserOnline()) return enqueue(op);
    try { await fn(); return { ok: true }; }
    catch (e) { if (e instanceof OfflineError) return enqueue(op); throw e; }
  }
  async function flushQueue() {
    if (S.flushing || !S.user || !isBrowserOnline()) return;
    S.flushing = true;
    try {
      let q = qLoad(); if (!q.length) return;
      setStatus('syncing', { queued: q.length });
      while (q.length) {
        const op = q[0];
        try { await OPS[op.kind](op); }
        catch (e) { if (e instanceof OfflineError) { setStatus('offline', { queued: q.length }); return; } setStatus('error', { op, error: e }); }
        q = qLoad().filter(o => !(o.kind === op.kind && o.key === op.key && o.t === op.t)); qSave(q);
      }
      setStatus('online');
    } finally { S.flushing = false; }
  }

  // ---------- raw operations (also replayed from the queue) ----------
  const OPS = {
    async settings(op) { await run(S.sb.from('settings').upsert({ user_id: uid(), data: op.data, version: op.version }, { onConflict: 'user_id' })); },
    async upsertApp(op) { await run(S.sb.from('installed_apps').upsert({ ...op.row, user_id: uid() }, { onConflict: 'user_id,app_id' })); },
    async removeApp(op) { await run(S.sb.from('installed_apps').delete().eq('user_id', uid()).eq('app_id', op.key)); },
    async mkdir(op) { await run(S.sb.from('files').upsert({ user_id: uid(), path: op.key, name: baseName(op.key), is_dir: true, size: 0, mime: null, content: null, storage_path: null }, { onConflict: 'user_id,path' })); },
    async writeFile(op) { await rawWrite(op.key, op.data, op.mime); },
    async deletePath(op) { await rawDelete(op.key); },
  };

  async function rawWrite(path, data, mime) {
    const me = uid(); path = normPath(path);
    if (path === '/') throw new Error('cannot write to /');
    const name = baseName(path);
    let blob = null, content = null, size;
    if (typeof Blob !== 'undefined' && data instanceof Blob) blob = data;
    else if (data instanceof ArrayBuffer || ArrayBuffer.isView(data)) blob = new Blob([data], { type: mime || 'application/octet-stream' });
    else {
      const s = String(data == null ? '' : data);
      if (/^data:[^,]*;base64,/.test(s) && s.length > 1024) blob = dataUrlToBlob(s);  // images etc. go to the bucket as real bytes
      else if (byteLen(s) <= INLINE_MAX) { content = s; size = byteLen(s); }
      else blob = new Blob([s], { type: mime || guessMime(name) || 'text/plain' });
    }
    if (blob) { size = blob.size; mime = mime || blob.type || guessMime(name); if (size > MAX_FILE) throw new Error(`${name} is ${(size / 1048576).toFixed(1)} MB; the cloud limit is 20 MB`); }
    else mime = mime || guessMime(name) || 'text/plain';
    const old = await run(S.sb.from('files').select('storage_path').eq('user_id', me).eq('path', path).maybeSingle());
    let storage_path = null;
    if (blob) {
      storage_path = me + '/' + uuid();               // new object each write, old one removed after the row points at the new one
      await run(S.sb.storage.from(BUCKET).upload(storage_path, blob, { contentType: mime || 'application/octet-stream', upsert: false }));
    }
    try {
      await run(S.sb.from('files').upsert({ user_id: me, path, name, mime, size, is_dir: false, content, storage_path }, { onConflict: 'user_id,path' }));
    } catch (e) { if (storage_path) try { await S.sb.storage.from(BUCKET).remove([storage_path]); } catch (_) {} throw e; }
    if (old && old.storage_path && old.storage_path !== storage_path) try { await S.sb.storage.from(BUCKET).remove([old.storage_path]); } catch (_) {}
    // parent folders, so the file tree is complete on another device
    const dirs = []; let p = path; while ((p = p.slice(0, p.lastIndexOf('/'))) ) dirs.push(p);
    if (dirs.length) await run(S.sb.from('files').upsert(dirs.map(d => ({ user_id: me, path: d, name: baseName(d), is_dir: true, size: 0 })), { onConflict: 'user_id,path', ignoreDuplicates: true }));
  }
  async function rawDelete(path) {
    const me = uid(); path = normPath(path);
    let rows;
    if (path === '/') rows = await run(S.sb.from('files').select('path,storage_path').eq('user_id', me));
    else {
      const self = await run(S.sb.from('files').select('path,storage_path').eq('user_id', me).eq('path', path));
      const kids = await run(S.sb.from('files').select('path,storage_path').eq('user_id', me).like('path', escLike(path) + '/%'));
      rows = [...(self || []), ...(kids || []).filter(r => r.path.startsWith(path + '/'))];
    }
    if (!rows || !rows.length) return;
    const blobs = rows.map(r => r.storage_path).filter(Boolean);
    for (let i = 0; i < blobs.length; i += 100) await run(S.sb.storage.from(BUCKET).remove(blobs.slice(i, i + 100)));
    const paths = rows.map(r => r.path);
    for (let i = 0; i < paths.length; i += 200) await run(S.sb.from('files').delete().eq('user_id', me).in('path', paths.slice(i, i + 200)));
  }

  // ---------- OS shape <-> cloud shape ----------
  /** cfg (Nova OS config object) -> settings.data. customApps go to installed_apps instead; LOCAL_ONLY_KEYS stay on device. */
  function cfgToSettings(cfg) {
    const d = {}; for (const k of Object.keys(cfg || {})) if (k !== 'customApps' && !LOCAL_ONLY_KEYS.includes(k)) d[k] = cfg[k];
    return d;
  }
  /** OS customApps entry -> installed_apps row */
  function appToRow(a) {
    const { id, name, icon, description, desc, version, author, html, url, ...rest } = a || {};
    if (!id || !name) throw new Error('app needs id and name');
    const meta = {}; for (const k of Object.keys(rest)) if (rest[k] !== undefined) meta[k] = rest[k];
    return { app_id: String(id).slice(0, 100), name: String(name).slice(0, 60), icon: icon == null ? null : String(icon),
      description: (description || desc || '') ? String(description || desc).slice(0, 400) : null,
      version: version == null ? null : String(version).slice(0, 20), author: author == null ? null : String(author).slice(0, 60),
      html: html == null ? null : String(html), url: url == null ? null : String(url), meta };
  }
  /** installed_apps row -> OS customApps entry (same shape addCustomApp() builds) */
  function rowToApp(r) {
    const a = { ...(r.meta || {}), id: r.app_id, name: r.name, icon: r.icon || '📦', description: r.description || '', desc: r.description || '',
      version: r.version || '1.0', author: r.author || '' };
    if (r.html != null) a.html = r.html; if (r.url != null) a.url = r.url;
    if (!a.type) a.type = r.html != null ? 'html' : 'url';
    return a;
  }

  // ---------- community apps mapping ----------
  const COMMUNITY_LIST_COLS = 'id,publisher_id,app_id,name,icon,description,category,version,author,color,report_count,hidden,created_at,updated_at';
  const COMMUNITY_HTML_MAX = 1024 * 1024;
  /** Appetite / webos-install shape -> community_apps columns. full=true requires id, name, html. */
  function communityRow(a, full) {
    const r = {}, has = k => a[k] !== undefined;
    const id = a.app_id !== undefined ? a.app_id : a.id;
    if (full || id !== undefined) { if (!/^[A-Za-z0-9_.-]{1,80}$/.test(String(id || ''))) throw new Error('app id must be 1-80 of A-Z a-z 0-9 _ . -'); r.app_id = String(id); }
    if (full || has('name')) { const n = String(a.name || '').trim(); if (!n || n.length > 60) throw new Error('app name must be 1-60 characters'); r.name = n; }
    if (has('icon') || has('emoji')) r.icon = a.icon != null ? String(a.icon) : a.emoji != null ? String(a.emoji) : null;
    else if (full) r.icon = '📦';
    if (has('description') || has('desc')) r.description = String(a.description ?? a.desc ?? '').slice(0, 400) || null;
    if (has('category')) r.category = a.category == null ? null : String(a.category).slice(0, 40);
    if (has('version')) r.version = a.version == null ? null : String(a.version).slice(0, 20);
    if (has('author')) r.author = a.author == null ? null : String(a.author).slice(0, 60);
    if (has('color')) r.color = /^#[0-9a-f]{3,8}$/i.test(a.color || '') ? a.color : null;
    if (full || has('html')) {
      const h = a.html == null ? '' : String(a.html);
      if (!h) throw new Error('community apps need html (web-url apps are not supported)');
      if (byteLen(h) > COMMUNITY_HTML_MAX) throw new Error('app html is over the 1 MB community limit');
      r.html = h;
    }
    return r;
  }
  /** community_apps row (with html) -> the webos-install app shape, ready for handleInstallRequest/addCustomApp. */
  function communityToInstall(r) {
    return { id: r.app_id, name: r.name, icon: r.icon || '📦', description: r.description || '', version: r.version || '1.0',
      author: r.author || '', category: r.category || undefined, color: r.color || undefined, html: r.html };
  }

  // ---------- auth ----------
  function emitAuth(event, session) {
    const prev = S.user && S.user.id;
    S.user = session ? session.user : null;
    if (!S.user || S.user.id !== prev) { S.fsSnap = null; S.pendingSettings = null; clearTimeout(S.settingsTimer); }
    for (const f of S.listeners) { try { f(event, S.user, session); } catch (e) { console.error(e); } }
    if (S.user) flushQueue();
  }
  const defaultRedirect = () => (typeof location !== 'undefined' && /^https?:/.test(location.protocol) ? location.origin + location.pathname : undefined);

  const NovaCloud = {
    OfflineError, BUCKET, INLINE_MAX, MAX_FILE, LOCAL_ONLY_KEYS,
    mapping: { cfgToSettings, appToRow, rowToApp, communityRow: a => communityRow(a, true), communityToInstall },

    /** init({url, anonKey, createClient?, cdn?, redirectTo?}) — call once at boot. Resolves with the current user or null. */
    async init(opts) {
      if (S.sb) return S.user;
      const { url, anonKey } = opts || {};
      if (!url || !/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/|$))/.test(url)) throw new Error('NovaCloud.init: url must be your https://<project>.supabase.co URL');
      if (!anonKey || /<|ANON/.test(anonKey)) throw new Error('NovaCloud.init: anonKey missing (Supabase → Project Settings → API → anon/publishable key)');
      if (looksSecret(anonKey)) throw new Error('NovaCloud.init: that is a service-role/secret key. Never ship it in a web page; use the anon (public) key.');
      S.opts = { ...opts };
      let createClient = opts.createClient;
      if (!createClient) {
        let mod; try { mod = await import(opts.cdn || CDN_DEFAULT); } catch (e) { mod = await import(CDN_FALLBACK); }
        createClient = mod.createClient || (mod.default && mod.default.createClient);
      }
      S.sb = createClient(url, anonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'nova-cloud-auth' } });
      S.sb.auth.onAuthStateChange((event, session) => emitAuth(event, session));
      try { const { data } = await S.sb.auth.getSession(); S.user = data && data.session ? data.session.user : null; } catch (_) { S.user = null; }
      if (typeof addEventListener === 'function') {
        addEventListener('online', () => { setStatus('online'); flushQueue(); });
        addEventListener('offline', () => setStatus('offline'));
        addEventListener('beforeunload', () => { NovaCloud.flushSettings(); });
      }
      if (S.user) flushQueue();
      return S.user;
    },
    get ready() { return !!S.sb; },
    get user() { return S.user; },
    get client() { return S.sb; },          // escape hatch (still anon key + RLS)
    pendingCount() { return S.user ? qLoad().length : 0; },
    flush: () => flushQueue(),
    onStatus(fn) { S.statusListeners.add(fn); return () => S.statusListeners.delete(fn); },
    /** fn(event, user, session). Events: INITIAL_SESSION, SIGNED_IN, SIGNED_OUT, TOKEN_REFRESHED, USER_UPDATED, PASSWORD_RECOVERY */
    onAuthChange(fn) { S.listeners.add(fn); return () => S.listeners.delete(fn); },

    async signUp(email, password, { displayName, avatar, redirectTo } = {}) {
      need();
      const data = await run(S.sb.auth.signUp({ email, password, options: { emailRedirectTo: redirectTo || S.opts.redirectTo || defaultRedirect(),
        data: { ...(displayName ? { display_name: displayName } : {}), ...(avatar ? { avatar } : {}) } } }));
      return { user: data.user, needsConfirmation: !data.session };   // email confirmation on → no session until they click the link
    },
    async signIn(email, password) { need(); const d = await run(S.sb.auth.signInWithPassword({ email, password })); return d.user; },
    async signInWithMagicLink(email, { redirectTo, createUser = true } = {}) {
      need(); await run(S.sb.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectTo || S.opts.redirectTo || defaultRedirect(), shouldCreateUser: createUser } })); return true;
    },
    async resetPassword(email, { redirectTo } = {}) {
      need(); await run(S.sb.auth.resetPasswordForEmail(email, { redirectTo: redirectTo || S.opts.redirectTo || defaultRedirect() })); return true;
    },
    /** After the reset link: onAuthChange fires 'PASSWORD_RECOVERY' — show a new-password box and call this. */
    async updatePassword(newPassword) { need(); await run(S.sb.auth.updateUser({ password: newPassword })); return true; },
    async signOut({ everywhere = false } = {}) { need(); await NovaCloud.flushSettings().catch(() => {}); await run(S.sb.auth.signOut({ scope: everywhere ? 'global' : 'local' })); S.user = null; return true; },

    // ---------- profile ----------
    async getProfile() { const me = uid(); return await run(S.sb.from('profiles').select('id,display_name,avatar,created_at,updated_at').eq('id', me).maybeSingle()); },
    async updateProfile({ display_name, displayName, avatar } = {}) {
      const me = uid(), patch = {};
      if (display_name !== undefined || displayName !== undefined) patch.display_name = String(display_name ?? displayName).slice(0, 60);
      if (avatar !== undefined) patch.avatar = avatar;
      return await run(S.sb.from('profiles').update(patch).eq('id', me).select().maybeSingle());
    },

    // ---------- settings ----------
    /** -> {data, version, updated_at} (data {} for a fresh account) */
    async loadSettings() { const me = uid(); return (await run(S.sb.from('settings').select('data,version,updated_at').eq('user_id', me).maybeSingle())) || { data: {}, version: 1, updated_at: null }; },
    /** Debounced. Pass the whole cfg object; customApps / pass / fsGrants are stripped. {immediate:true} to skip the debounce. */
    saveSettings(cfg, { version, immediate = false } = {}) {
      uid();
      S.pendingSettings = { data: cfgToSettings(cfg), version: version || (cfg && cfg.cfgVersion) || 1 };
      clearTimeout(S.settingsTimer);
      const p = new Promise((res, rej) => S.settingsWaiters.push({ res, rej }));
      if (immediate) NovaCloud.flushSettings(); else S.settingsTimer = setTimeout(() => NovaCloud.flushSettings(), SETTINGS_DEBOUNCE);
      return p;
    },
    async flushSettings() {
      clearTimeout(S.settingsTimer);
      const pending = S.pendingSettings, waiters = S.settingsWaiters.splice(0);
      S.pendingSettings = null;
      if (!pending || !S.user) { waiters.forEach(w => w.res({ ok: true })); return { ok: true }; }
      const op = { kind: 'settings', key: 'settings', t: now(), ...pending };
      try { const r = await attempt(op, () => OPS.settings(op)); waiters.forEach(w => w.res(r)); return r; }
      catch (e) { waiters.forEach(w => w.rej(e)); throw e; }
    },

    // ---------- installed apps ----------
    async listApps() { const me = uid(); return (await run(S.sb.from('installed_apps').select('*').eq('user_id', me).order('installed_at'))).map(rowToApp); },
    /** app: an OS customApps entry {id,name,icon,html|url,description,version,author,...} */
    upsertApp(app) { uid(); const row = appToRow(app); const op = { kind: 'upsertApp', key: row.app_id, t: now(), row }; return attempt(op, () => OPS.upsertApp(op)); },
    removeApp(appId) { uid(); const op = { kind: 'removeApp', key: String(appId), t: now() }; return attempt(op, () => OPS.removeApp(op)); },

    // ---------- files ----------
    /** list(dir='/', {recursive}) -> [{path,name,is_dir,mime,size,updated_at,inline}] */
    async list(dir = '/', { recursive = false } = {}) {
      const me = uid(); dir = normPath(dir);
      let q = S.sb.from('files').select('path,name,is_dir,mime,size,updated_at,storage_path').eq('user_id', me);
      if (dir !== '/') q = q.like('path', escLike(dir) + '/%');
      const rows = (await run(q.order('path'))) || [];
      const pre = dir === '/' ? '/' : dir + '/';
      return rows.filter(r => r.path.startsWith(pre) && (recursive || !r.path.slice(pre.length).includes('/')))
        .map(({ storage_path, ...r }) => ({ ...r, inline: !storage_path }));
    },
    /** read(path, {as:'auto'|'text'|'dataurl'|'blob'}) -> string | Blob | null. auto: text for text files, data: URL for binary (what the OS stores). */
    async read(path, { as = 'auto' } = {}) {
      const me = uid(); path = normPath(path);
      const r = await run(S.sb.from('files').select('is_dir,mime,content,storage_path').eq('user_id', me).eq('path', path).maybeSingle());
      if (!r || r.is_dir) return null;
      if (!r.storage_path) return as === 'blob' ? new Blob([r.content || ''], { type: r.mime || 'text/plain' }) : (r.content || '');
      const blob = await run(S.sb.storage.from(BUCKET).download(r.storage_path));
      const typed = blob.type ? blob : new Blob([blob], { type: r.mime || 'application/octet-stream' });
      if (as === 'blob') return typed;

const safeAvatarId=v=>typeof v==='string'&&AVATAR_IDS.includes(v)?v:DEFAULT_AVATAR;
function avatarFace(id,cls=''){id=safeAvatarId(id);const d=el('div',{class:'avatar av-art '+cls,'data-avatar':id});
 const src=Object.prototype.hasOwnProperty.call(AVATAR_ART,id)?AVATAR_ART[id]:'';

const SAFE_IMG=/^data:image\/(png|jpe?g|gif|webp|svg\+xml);base64,[A-Za-z0-9+/=]+$/;
/* Magic-link / reset / confirmation emails come back here: the current page when it is https (or a localhost dev
   server), otherwise (file://, plain http) the permanent home. That origin must be in Supabase's Redirect URLs. */
const NOVA_HOME='https://cooloutlawsstudio.github.io/nova-os/'; // primary home (GitHub Pages, = Supabase Site URL); used as the sign-in redirect when the OS runs from file:// or plain http
const authRedirect=()=>location.protocol==='https:'||/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(location.origin)?location.origin+location.pathname:NOVA_HOME;
const AUTH_P='novaauth:',SB_SESSION_KEY='nova-cloud-auth';
const withTimeout=(p,ms,msg)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error(msg||'timed out'),{offline:true})),ms))]);
function stableJSON(v){if(Array.isArray(v))return'['+v.map(stableJSON).join(',')+']';if(v&&typeof v==='object')return'{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+stableJSON(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v);}

/* ---- backend config: NOVA_SUPABASE, or a per-device override from Settings > Account ---- */
function sbKeyProblem(key){key=String(key||'').trim();if(!key)return'Enter the anon (public) key';
 if(/^sb_secret_/i.test(key))return'That is a secret key. Use the anon / publishable key; secret and service-role keys must never be in a browser.';
 if(/^sb_publishable_/i.test(key))return null;
 const p=key.split('.');if(p.length!==3)return'That does not look like a Supabase anon key';
 try{const j=JSON.parse(atob(p[1].replace(/-/g,'+').replace(/_/g,'/')));if(j.role==='service_role')return'That is the service-role key. Use the anon (public) key; the service-role key bypasses all security and must never be in a browser.';if(j.role&&j.role!=='anon')return'Expected a key with role "anon"';}catch(e){return'That does not look like a Supabase anon key'}
 return null;}
function sbUrlProblem(u){let x;try{x=new URL(String(u||'').trim())}catch(e){return'Enter the project URL, like https://abcd.supabase.co'}
 if(x.protocol==='https:')return null;if(x.protocol==='http:'&&/^(localhost|127\.0\.0\.1)$/.test(x.hostname))return null;return'The URL must start with https://';}
function sbConfig(){let o=null;try{o=JSON.parse(localStorage.getItem(AUTH_P+'backend')||'null')}catch(e){}
 const c=o&&o.url?o:NOVA_SUPABASE;if(!c||!c.url||!c.anonKey||sbUrlProblem(c.url)||sbKeyProblem(c.anonKey))return null;

const AUTH={
 guest(v){try{if(v===undefined)return localStorage.getItem(AUTH_P+'guest')==='1';if(v)localStorage.setItem(AUTH_P+'guest','1');else localStorage.removeItem(AUTH_P+'guest')}catch(e){return false}},
 known(){try{const k=JSON.parse(localStorage.getItem(AUTH_P+'known')||'{}');return k&&typeof k==='object'?k:{}}catch(e){return{}}}, // uid -> {email,name,avatar} for "recent accounts" (no tokens)
 remember(uid,info){if(!uid)return;const k=this.known();k[uid]=Object.assign(k[uid]||{},info,{at:Date.now()});try{localStorage.setItem(AUTH_P+'known',JSON.stringify(k))}catch(e){}},
 forget(uid){const k=this.known();delete k[uid];try{localStorage.setItem(AUTH_P+'known',JSON.stringify(k))}catch(e){}},
 /* who is signed in, read without the network so a signed-in user can boot offline. Only id/email are read. */

const ACCT={holdSync:false,mode:'guest',uid:null,email:'',profile:null,meta:null,started:false,applying:false,justSignedIn:false,cfgB:null,_init:null,fsBase:false,status:'off',err:'',

 ensureCloud(){if(!this.cfgB)return Promise.reject(new Error('No account server is set up'));
  if(!this._init)this._init=NovaCloud.init({url:this.cfgB.url,anonKey:this.cfgB.anonKey,redirectTo:authRedirect()}).catch(e=>{this._init=null;throw e});
  return this._init;},
 /* ---- boot: decide guest vs account before any config is loaded ---- */
 async boot(){this.cfgB=sbConfig();KV.ns='';if(!this.cfgB)return;
  NovaCloud.onAuthChange((ev,user)=>this.onAuth(ev,user));NovaCloud.onStatus((s,info)=>this.onCloudStatus(s,info));
  if(/[?&]guest(=1)?(&|$)/.test(location.search)&&!AUTH.stored())AUTH.guest(true); // ?guest opens straight into guest mode (also used by the test suites)
  let msg='';const h=location.hash.slice(1);
  if(/(^|&)(access_token|error_description|error_code|error)=/.test(h)){ // magic link, sign-up confirmation or password reset coming back
   const p=new URLSearchParams(h);if(p.get('error_description')||p.get('error'))msg=String(p.get('error_description')||p.get('error')).replace(/\+/g,' ').slice(0,200);
   if(p.get('type')==='recovery')this.needNewPassword=true;
   if(p.get('access_token'))try{await withTimeout(this.ensureCloud(),20000,'Could not reach the sign-in service');if(NovaCloud.user){this.justSignedIn=true;AUTH.guest(false)}}catch(e){msg=e.message}
   try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
  try{if(sessionStorage.getItem(AUTH_P+'fresh')){sessionStorage.removeItem(AUTH_P+'fresh');this.justSignedIn=true}}catch(e){} // just signed in before a reload: skip the lock screen
  const su=AUTH.stored();
  if(su){this.uid=su.id;this.email=su.email;this.ensureCloud().catch(e=>console.warn('Account server:',e.message));}
  else if(!AUTH.guest()||msg)await this.signInScreen({boot:true,msg});
  if(this.uid){this.mode='user';KV.ns='u:'+this.uid+':';AUTH.remember(this.uid,{email:this.email});}},
 onAuth(ev,user){
  if(ev==='PASSWORD_RECOVERY'){this.needNewPassword=true;if(this.started)this.newPasswordDialog()}
  if(ev==='SIGNED_IN'&&user&&this.started&&this.mode==='user'&&user.id!==this.uid){this.leave(()=>location.reload());return} // another tab switched account
  if(ev==='SIGNED_OUT'&&this.started&&this.mode==='user'&&!this.signingOut){toast('You were signed out. Your changes are kept on this device; sign in again to sync.','🔑',6000);setTimeout(()=>this.leave(()=>location.reload()),2500)}

 if(d.type==='webos-install')return handleInstallRequest(d.app,src,(ok,error)=>{send({type:'webos-installed',id:d.app&&d.app.id,ok,error});send({type:'webos-installed-list',apps:installedList()})},origin);
 if(d.type==='webos-list-installed')return send({type:'webos-installed-list',apps:installedList()});
 if(d.type==='webos-uninstall'&&d.id){const a=cfg.customApps.find(x=>x.extId===d.id);if(!a)return send({type:'webos-uninstalled',id:d.id,ok:false});uninstall(a.id).then(ok=>{send({type:'webos-uninstalled',id:d.id,ok:!!ok});send({type:'webos-installed-list',apps:installedList()})});return;}
 // open-app / publish-app are only honoured from the built-in Appetite Store window itself (no prompt is shown for them).
 if(d.source==='appetite'&&d.app){const a=d.app;
  if((d.type==='open-app'||d.type==='publish-app')&&!fromAppetite){console.warn('Ignored Appetite '+d.type+' message from a window that is not the built-in Appetite Store');return;}

/* Window shortcuts forwarded from inside app frames (KEY_FWD in 6.js). Accepted only when the sender is the iframe that
   has focus right now (document.activeElement), is a srcdoc frame directly inside an OS window, and is not a Browser tab. */
function handleFrameKey(d,src){const f=document.activeElement;if(!f||f.tagName!=='IFRAME'||f.contentWindow!==src||f.hasAttribute('src')||!f.hasAttribute('srcdoc'))return;
 const fw=[...WM.wins.values()].find(w=>w.el.contains(f));if(!fw||fw.appId==='browser'||fw.el.classList.contains('min'))return;
 if(d.combo==='release'){if(SW.open&&SW.held)commitSwitcher();return;}
 if(WM.active!==fw)fw.focus();
 if(d.combo==='close'){f.blur();fw.close();return;}
 if(d.combo==='switch'){openSwitcher(d.ctrl?'ctrlalt':'alt',d.shift?-1:1);return;}}

/* ============ Store relay (Appetite only; see STORE-API.md) ============
   Appetite never touches NovaCloud or tokens: it asks, the OS answers. Replies never carry an email or a token. */
const STORE_RELAY=new Set(['webos-get-catalog','webos-account-status','webos-open-app','webos-open-signin','webos-community-list','webos-community-get','webos-community-install','webos-community-publish','webos-community-update','webos-community-delete','webos-community-report']);
function appetiteFrames(){const out=[];for(const w of WM.wins.values())if(w.appId==='appetite')w.el.querySelectorAll('.wbody > .fill > iframe').forEach(f=>out.push(f));return out;}
const storeIcon=i=>typeof i==='string'&&(i.length<=16||/^data:image\/(svg\+xml|png|jpeg|webp|gif);base64,/.test(i))?i:'📦';
function officialById(id){if(CATALOG[id])return{localId:id,kind:'builtin'};const w=WEBAPPS.find(x=>x.id===id);return w?{localId:w.id,kind:'web',w}:null;}
const iconPair=i=>typeof i==='string'&&i.startsWith('data:image/')?{icon:'📦',iconUrl:safeIconUrl(i)||undefined}:{icon:storeIcon(i)};
function storeCatalog(){return[...Object.entries(CATALOG).map(([id,a])=>({id,name:a.name,...iconPair(a.icon),description:a.desc||'',version:'1.0',author:'Nova OS',category:a.cat||'',kind:'builtin',installed:isInstalled(id),builtin:true})),
 ...WEBAPPS.map(w=>({id:w.id,name:w.name,...iconPair(w.icon),description:w.desc||'',version:'1.0',author:'Nova OS',category:'Web',kind:'web',installed:isInstalled(w.id),builtin:true})),
 // apps installed from Appetite itself (appetite-*): Appetite only uses these to update its installed state
 ...cfg.customApps.filter(a=>typeof a.extId==='string'&&a.extId.startsWith('appetite-')).map(a=>({id:a.extId,name:a.name,...iconPair(a.icon),description:a.description||'',version:a.version||'',author:a.author||'',installed:true,builtin:false,kind:'appetite'}))];}
function broadcastCatalog(){const m={type:'webos-catalog',apps:storeCatalog()};appetiteFrames().forEach(f=>{try{f.contentWindow.postMessage(m,'*')}catch(_){}})}
function installOfficial(id,reply){const o=officialById(id);if(!o)return reply(false,'unknown official app');if(isInstalled(o.localId))return reply(true);
 if(o.kind==='builtin')install(id);else{addCustomApp({id:o.w.id,name:o.w.name,icon:o.w.icon,type:'url',url:o.w.url,description:o.w.desc,c:['#0ea5e9','#6366f1'],w:1000,h:680});toast(o.w.name+' installed','✅')}
 reply(true);}
async function storeRelay(d,send,src,origin){const t=d.type,id=d.id==null?undefined:String(d.id).slice(0,100);
 if(t==='webos-get-catalog')return send({type:'webos-catalog',apps:storeCatalog()});
 if(t==='webos-account-status')return send(ACCT.accountStatus());
 if(t==='webos-open-app'){const a=getApp(id);if(a&&isInstalled(a.id))openApp(a.id);return;}
 if(t==='webos-open-signin'){if(ACCT.enabled()&&ACCT.mode!=='user')ACCT.signInScreen({});else openApp('settings','account');return;}
 const R={'webos-community-list':'webos-community-apps','webos-community-get':'webos-community-app','webos-community-install':'webos-community-installed','webos-community-publish':'webos-community-published',
  'webos-community-update':'webos-community-updated','webos-community-delete':'webos-community-deleted','webos-community-report':'webos-community-reported'}[t];
 const fn={'webos-community-list':'listCommunityApps','webos-community-get':'getCommunityApp','webos-community-install':'getCommunityApp','webos-community-publish':'publishApp','webos-community-update':'updateCommunityApp','webos-community-delete':'deleteCommunityApp','webos-community-report':'reportApp'}[t];
 const fail=error=>send({type:R,ok:false,id,error});
 if(!ACCT.enabled())return fail('unavailable');
 try{await withTimeout(ACCT.ensureCloud(),15000)}catch(e){return fail(navigator.onLine?'unavailable':'offline')}
 if(typeof NovaCloud[fn]!=='function')return fail('unavailable');
 const needUser=!['webos-community-list','webos-community-get','webos-community-install'].includes(t);
 if(needUser&&!(ACCT.mode==='user'&&NovaCloud.user))return fail('signed-out');
 try{
  if(t==='webos-community-list'){const o={};if(d.search!=null)o.search=String(d.search).slice(0,80);if(d.category!=null)o.category=String(d.category).slice(0,40);if(d.limit!=null)o.limit=+d.limit||50;if(d.offset!=null)o.offset=+d.offset||0;
   const me=ACCT.mode==='user'?ACCT.uid:'';
   return send({type:R,ok:true,apps:(await NovaCloud.listCommunityApps(o)).map(r=>Object.assign({},r,{publisher_uid:r.publisher_id,author_name:r.author||'',mine:!!me&&r.publisher_id===me}))});}
  if(t==='webos-community-publish'){const a=d.app&&typeof d.app==='object'?d.app:null;if(!a)return fail('missing app');if(typeof a.html==='string'&&new Blob([a.html]).size>400*1024)return fail('too-large');
   const row=await NovaCloud.publishApp(a);return send({type:R,ok:true,id:row.id,app:Object.assign({},row,{publisher_uid:row.publisher_id,mine:true})});}
  if(!id)return fail('missing id');
  if(t==='webos-community-get'){const r=await NovaCloud.getCommunityApp(id);return r?send({type:R,ok:true,id,app:r}):fail('not-found');}
  if(t==='webos-community-install'){const r=await NovaCloud.getCommunityApp(id);if(!r)return fail('not-found');
   // community html is untrusted: same install prompt and sandbox as any app. The id is the row uuid so two publishers' app ids never collide.
   const app=Object.assign(NovaCloud.mapping.communityToInstall(r),{id:'community-'+r.id});
   return handleInstallRequest(app,src,(ok,error)=>{send({type:R,ok,id,error});send({type:'webos-installed',id:app.id,communityId:r.id,ok,error});send({type:'webos-installed-list',apps:installedList()});broadcastCatalog()},origin+' · community app by '+String(r.author||'someone').slice(0,60));}
  if(t==='webos-community-update'){await NovaCloud.updateCommunityApp(id,d.patch&&typeof d.patch==='object'?d.patch:{});return send({type:R,ok:true,id});}
  if(t==='webos-community-delete'){const r=await NovaCloud.deleteCommunityApp(id);return send(r.ok?{type:R,ok:true,id}:{type:R,ok:false,id,error:'not-found-or-not-yours'});}
  if(t==='webos-community-report'){const r=await NovaCloud.reportApp(id,d.reason==null?undefined:String(d.reason).slice(0,500));return send(r.ok?{type:R,ok:true,id}:{type:R,ok:false,id,error:r.duplicate?'duplicate':r.denied?'denied':'failed'});}
 }catch(e){return fail(e&&(e.offline||e.name==='OfflineError')?'offline':String(e&&e.message||e).slice(0,200))}}
