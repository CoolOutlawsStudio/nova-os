><\\/div><\\/details>\\n<\\/div>\\n\\n<div id=\\\"dock\\\" class=\\\"glass\\\">\\n  <button id=\\\"btnPlay\\\" class=\\\"on\\\" title=\\\"Pause / resume (Space)\\\"><svg class=\\\"i\\\" viewBox=\\\"0 0 24 24\\\" id=\\\"playIcon\\\"><path d=\\\"M8 5v14M16 5v14\\\"/><\\/svg><\\/button>\\n  <button id=\\\"btnStep\\\" title=\\\"Step one tick (.)\\\"><svg class=\\\"i\\\" viewBox=\\\"0 0 24 24\\\"><path d=\\\"M6 5l9 7-9 7zM18 5v14\\\"/><\\/svg><\\/button>\\n  <div class=\\\"spd\\\"><input type=\\\"range\\\" id=\\\"speed\\\" min=\\\"1\\\" max=\\\"20\\\" value=\\\"2\\\" title=\\\"Simulation speed\\\"><span id=\\\"speedv\\\">2x<\\/span><\\/div>\\n  <div class=\\\"sep\\\"><\\/div>\\n  <button data-tool=\\\"inspect\\\" class=\\\"on\\\" title=\\\"Inspect / pan (1)\\\">🔍<\\/button>\\n  <button data-tool=\\\"food\\\" title=\\\"Food brush (2)\\\">🌱<\\/button>\\n  <button data-tool=\\\"herb\\\" title=\\\"Spawn herbivore (3)\\\">🐇<\\/button>\\n  <button data-tool=\\\"pred\\\" title=\\\"Spawn predator (4)\\\">🐺<\\/button>\\n  <button data-tool=\\\"smite\\\" title=\\\"Smite (5)\\\">⚡<\\/button>\\n  <button data-tool=\\\"wall\\\" title=\\\"Paint walls (6)\\\">🧱<\\/button>\\n  <button data-tool=\\\"erase\\\" title=\\\"Erase walls (7)\\\">🧽<\\/button>\\n  <div class=\\\"sep\\\"><\\/div>\\n  <button id=\\\"btnFit\\\" title=\\\"Fit view\\\"><svg class=\\\"i\\\" viewBox=\\\"0 0 24 24\\\"><path d=\\\"M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5\\\"/><\\/svg><\\/button>\\n  <button id=\\\"btnPanel\\\" title=\\\"Toggle panel\\\"><svg class=\\\"i\\\" viewBox=\\\"0 0 24 24\\\"><rect x=\\\"3\\\" y=\\\"4\\\" width=\\\"18\\\" height=\\\"16\\\" rx=\\\"3\\\"/><path d=\\\"M14 4v16\\\"/><\\/svg><\\/button>\\n<\\/div>\\n<div id=\\\"minimap\\\" class=\\\"glass\\\"><canvas id=\\\"mini\\\"><\\/canvas><\\/div>\\n<div id=\\\"help\\\">Scroll/pinch = zoom · drag = pan · <kbd>Space<\\/kbd> pause · <kbd>.<\\/kbd> step · <kbd>F<\\/kbd> follow · <kbd>1<\\/kbd>–<kbd>7<\\/kbd> tools · <kbd>Esc<\\/kbd> deselect<\\/div>\\n\\n<script>window.LW_SINGLE_FILE = true;<\\/script>\\n<script>\\n/* js/sim.js */\\n/* Living World Simulator — simulation core (no rendering). */\\n'use strict';\\n/* ===================== RNG ===================== */\\nlet rngState = 1;\\nfunction hashStr(s){ let h = 1779033703 ^ s.length; for (let i=0;i<s.length;i++){ h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; } h = Math.imul(h ^ h>>>16, 2246822507); h = Math.imul(h ^ h>>>13, 3266489909); return (h ^ h>>>16)>>>0; }\\nfunction rand(){ let t = rngState = (rngState + 0x6D2B79F5)|0; t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14)>>>0)/4294967296; }\\nlet spareN = null;\\nfunction randn(){ if (spareN !== null){ const v=spareN; spareN=null; return v; } let u=0,v=0; while(u===0) u=rand(); v=rand(); const m=Math.sqrt(-2*Math.log(u)); spareN = m*Math.sin(2*Math.PI*v); return m*Math.cos(2*Math.PI*v); }\\nconst clamp=(v,a,b)=>v<a?a:v>b?b:v;\\nconst lerp=(a,b,t)=>a+(b-a)*t;\\n\\n/* ===================== WORLD CONSTANTS ===================== */\\nconst W = 2000, H = 1300;\\nconst CS = 60, HGW = Math.ceil(W/CS), HGH = Math.ceil(H/CS);\\nconst WCELL = 20, GW = W/WCELL, GH = H/WCELL;\\nconst YEAR = 3600, DAY = 720, SEASONS = ['Spring','Summer','Autumn','Winter'], SEASON_ICON=['🌱','☀️','🍂','❄️'];\\nconst MAX_PLANTS = 1700, PLANT_MAX_E = 30;\\nconst CFG = { food:1, mut:1, maxPop:550, sexual:true, respawn:true, dayNight:true };\\n\\n/* ===================== GENOME ===================== */\\nconst GDEF = {\\n  speed:[0.6,3.2], size:[3,13], vision:[30,220], metab:[0.6,1.5], diet:[0,1],\\n  repro:[0.45,0.95], coat:[0,1], lifespan:[0.6,1.4], hueA:[0,1]\\n};\\nconst GKEYS = Object.keys(GDEF);\\nconst GLABEL = {speed:'Speed',size:'Size',vision:'Vision',metab:'Metabolism',diet:'Diet (carn.)',repro:'Repro thr.',coat:'Fur/coat',lifespan:'Lifespan',hueA:'Lineage hue'};\\nfunction gnorm(g,k){ const r=GDEF[k]; return (g[k]-r[0])/(r[1]-r[0]); }\\n\\n/* ===================== BRAIN ===================== */\\nconst NI = 12, NH = 10, NO = 3;\\nconst NW = NI*NH + NH + NH*NO + NO;\\nconst IN_LABELS = ['food sin','food cos','food near','crt sin','crt cos','crt near','rel size','threat','energy','temp','wall','osc'];\\nconst OUT_LABELS = ['turn','throttle','attack'];\\nconst iW1=(i,h)=>h*NI+i, iB1=h=>NI*NH+h, iW2=(h,o)=>NI*NH+NH+o*NH+h, iB2=o=>NI*NH+NH+NH*NO+o;\\nfunction forward(w, inp, hid, out){\\n  let k=0;\\n  for (let h=0;h<NH;h++){ let s=0; for(let i=0;i<NI;i++) s+=w[k++]*inp[i]; hid[h]=s; }\\n  for (let h=0;h<NH;h++){ hid[h]=Math.tanh(hid[h]+w[k++]); }\\n  for (let o=0;o<NO;o++){ let s=0; for(let h=0;h<NH;h++) s+=w[k++]*hid[h]; out[o]=s; }\\n  for (let o=0;o<NO;o++){ out[o]=Math.tanh(out[o]+w[k++]); }\\n}\\nfunction priorBrain(diet){\\n  const w = new Float32Array(NW);\\n  for (let k=0;k<NW;k++) w[k]=randn()*0.3;\\n  const pred = diet>0.5;\\n  if (!pred){ w[iW1(0,0)]+=2.6; } else { w[iW1(3,0)]+=2.6; }\\n  w[iW2(0,0)] += 2.0;\\n  w[iB1(1)] += 1.2; w[iW2(1,1)] += 1.6;\\n  w[iW1(8,1)] -= 0.4;\\n  if (pred){ w[iW1(5,2)]+=3; w[iW1(6,2)]-=2.2; w[iB1(2)]-=0.8; w[iW2(2,2)]+=2.6; w[iW1(5,1)]+=1.0; }\\n  else { w[iB2(2)] -= 1.8; w[iW1(7,3)] -= 3.0; w[iW2(3,0)] += 2.2; w[iW1(5,1)] += 0.6; }\\n  w[iW1(10,4)] += 3.0; w[iW2(4,0)] += 1.6; w[iW2(4,1)] -= 0.8;\\n  return w;\\n}\\n\\n/* ===================== NAMES ===================== */\\nconst SYL = ['ka','lo','mi','ra','zu','te','no','vi','sa','qu','el','ox','ar','fi','du','ny','po','ge','ba','ish','or','um','ze','ty'];\\nfunction nameOf(id){ let h = hashStr('n'+id), s=''; const n = 2 + (h%2); for (let i=0;i<n;i++){ s += SYL[h % SYL.length]; h = Math.floor(h / SYL.length) + 7919*i; } return s[0].toUpperCase()+s.slice(1); }\\n\\nfunction hsl2rgb(h,s,l){ h/=360; const a=s*Math.min(l,1-l); const f=n=>{ const k=(n+h*12)%12; return l - a*Math.max(-1, Math.min(k-3, 9-k, 1)); }; return [f(0),f(8),f(4)]; }\\n\\n/* ===================== STATE ===================== */\\nlet S;\\nlet nextId = 1;\\nconst cGrid = Array.from({length:HGW*HGH},()=>[]);\\nconst pGrid = Array.from({length:HGW*HGH},()=>[]);\\nlet walls = new Uint8Array(GW*GH);\\nlet wallsVersion = 1;\\n\\nfunction randomGenes(diet){\\n  const g = {};\\n  for (const k of GKEYS){ const r=GDEF[k]; g[k]=lerp(r[0],r[1],rand()); }\\n  const pred = diet>0.5;\\n  g.diet = clamp(diet + randn()*0.04, 0, 1);\\n  g.size = pred ? 8 + rand()*2.5 : 5 + rand()*2.5;\\n  g.speed = pred ? 1.9 + rand()*0.5 : 1.4 + rand()*0.6;\\n  g.vision = pred ? 120 + rand()*40 : 80 + rand()*50;\\n  g.repro = 0.62 + rand()*0.15;\\n  g.coat = 0.35 + rand()*0.3;\\n  g.metab = 0.9 + rand()*0.2;\\n  g.lifespan = 0.9 + rand()*0.2;\\n  return g;\\n}\\nfunction mutateGenes(g, rate){\\n  const n = Object.assign({}, g);\\n  for (const k of GKEYS){\\n    if (k==='hueA') continue;\\n    const r = GDEF[k];\\n    if (rand() < 0.3*rate) n[k] = clamp(n[k] + randn()*0.05*(r[1]-r[0]), r[0], r[1]);\\n  }\\n  n.hueA = ((n.hueA + randn()*0.025*rate) % 1 + 1) % 1;\\n  return n;\\n}\\nfunction mutateBrain(w, rate){\\n  const n = new Float32Array(w);\\n  if (rate<=0) return n;\\n  const p = 0.06*rate;\\n  for (let k=0;k<NW;k++) if (rand()<p) n[k] = clamp(n[k] + randn()*0.35, -5, 5);\\n  return n;\\n}\\nfunction crossover(g1,w1,g2,w2){\\n  const g = {};\\n  for (const k of GKEYS) g[k] = rand()<0.5 ? g1[k] : g2[k];\\n  let d = g2.hueA - g1.hueA; if (d>0.5) d-=1; if (d<-0.5) d+=1;\\n  g.hueA = ((g1.hueA + d*rand()) % 1 + 1) % 1;\\n  const w = new Float32Array(NW);\\n  const pick = []; for (let h=0;h<NH;h++) pick.push(rand()<0.5);\\n  for (let h=0;h<NH;h++){\\n    const src = pick[h]?w1:w2;\\n    for (let i=0;i<NI;i++) w[iW1(i,h)] = src[iW1(i,h)];\\n    w[iB1(h)] = src[iB1(h)];\\n    for (let o=0;o<NO;o++) w[iW2(h,o)] = src[iW2(h,o)];\\n  }\\n  for (let o=0;o<NO;o++) w[iB2(o)] = rand()<0.5 ? w1[iB2(o)] : w2[iB2(o)];\\n  return {g,w};\\n}\\nfunction genomeDist(a,b){\\n  let s=0; for (const k of GKEYS){ if (k==='hueA') continue; const d=gnorm(a,k)-gnorm(b,k); s+=d*d; }\\n  let dh = Math.abs(a.hueA-b.hueA); if (dh>0.5) dh=1-dh; s += (dh*2)*(dh*2);\\n  return Math.sqrt(s);\\n}\\n\\nclass Creature {\\n  constructor(g, w, x, y, gen, lineage){\\n    this.id = nextId++;\\n    this.name = nameOf(this.id);\\n    this.g = g; this.w = w;\\n    this.x = x; this.y = y; this.a = rand()*Math.PI*2; this.v = 0;\\n    this.gen = gen; this.lineage = lineage || this.id; this.lineageName = lineage ? nameOf(lineage) : this.name;\\n    this.age = 0; this.children = 0; this.kills = 0; this.cool = 0; this.born = S ? S.t : 0;\\n    this.inp = new Float32Array(NI); this.hid = new Float32Array(NH); this.out = new Float32Array(NO);\\n    this.dead = false; this.cause = '';\\n    this.r = g.size;\\n    this.maxE = 40 + 3*g.size*g.size;\\n    this.maxHp = g.size*6; this.hp = this.maxHp;\\n    this.maxAge = 3200 * g.lifespan * (0.6 + g.size/20);\\n    this.maturity = 380 / g.metab;\\n    this.maxSpeed = g.speed * (0.65 + 0.35*g.metab);\\n    this.plantEff = clamp(1 - g.diet*1.35, 0, 1);\\n    this.meatEff = clamp((g.diet-0.3)/0.6, 0, 1);\\n    this.pred = g.diet > 0.5;\\n    this.energy = this.maxE*0.5;\\n    const hue = 140*(1-g.diet) + (g.hueA-0.5)*100;\\n    const sat = 45 + (g.speed-0.6)/2.6*45;\\n    const lit = 62 - (g.size-3)/10*16;\\n    this.hue = (hue+360)%360;\\n    this.col = `hsl(${this.hue.toFixed(0)},${sat.toFixed(0)}%,${lit.toFixed(0)}%)`;\\n    this.colDark = `hsl(${this.hue.toFixed(0)},${sat.toFixed(0)}%,${(lit-28).toFixed(0)}%)`;\\n    this.rgb = hsl2rgb(this.hue, sat/100, lit/100);\\n    this.target = null; this.food = null; this.ate = 0; this.attacking = 0;\\n    this.phase = rand()*10; this.hurt = 0;\\n  }\\n}\\n\\nfunction isWall(x,y){\\n  if (x<0||y<0||x>=W||y>=H) return true;\\n  return walls[((y/WCELL)|0)*GW + ((x/WCELL)|0)] === 1;\\n}\\nfunction defaultWalls(){\\n  walls.fill(0);\\n  for (let gy=0; gy<GH; gy++){ if (gy<GH*0.38 || gy>GH*0.62) walls[gy*GW + Math.floor(GW*0.36)] = 1; }\\n  for (let gx=Math.floor(GW*0.56); gx<GW; gx++){ if (gx<GW*0.72 || gx>GW*0.86) walls[Math.floor(GH*0.5)*GW + gx] = 1; }\\n  // thicken ridges a bit so they read as rock formations\\n  const cp = walls.slice();\\n  for (let gy=1; gy<GH-1; gy++) for (let gx=1; gx<GW-1; gx++){ const i=gy*GW+gx; if (!cp[i] && (cp[i-1]||cp[i+1]||cp[i-GW]||cp[i+GW]) && hashStr('w'+i)%3===0) walls[i]=1; }\\n  wallsVersion++;\\n}\\n\\nfunction freeSpot(){\\n  for (let i=0;i<50;i++){ const x=20+rand()*(W-40), y=20+rand()*(H-40); if (!isWall(x,y)) return [x,y]; }\\n  return [W/2,H/2];\\n}\\nfunction fx(type, x, y, a, b){ if (S.fx.length < 3000 || type==='meteor') S.fx.push({type, x, y, a, b}); }\\nfunction spawnCreature(diet, x, y){\\n  if (x===undefined){ [x,y] = freeSpot(); }\\n  const g = randomGenes(diet);\\n  const c = new Creature(g, priorBrain(g.diet), x, y, 1, 0);\\n  c.energy = c.maxE*0.7;\\n  S.creatures.push(c); S.births++;\\n  fx('birth', x, y, c);\\n  return c;\\n}\\nfunction addPlant(x,y,e){\\n  if (S.plants.length >= MAX_PLANTS) return false;\\n  if (isWall(x,y)) return false;\\n  S.plants.push({x,y,e:e===undefined?6:e, s:rand()*6.283, born:S.t});\\n  return true;\\n}\\n\\nfunction reset(seed){\\n  rngState = hashStr(String(seed)); spareN = null;\\n  nextId = 1;\\n  S = {\\n    seed:String(seed), t:0, creatures:[], plants:[], births:0, deaths:0, maxGen:1,\\n    hist:[], histEvery:15, plantAcc:0, fx:[], newborn:[],\\n    env:{temp:0, growth:1, season:0, year:1, event:null, eventLeft:0, daylight:1, phase:0},\\n    hotspots:[], log:[], species:0,\\n    bestEver:{name:'-', children:0, id:0}, oldestEver:{name:'-', age:0, id:0},\\n    extinctions:0, deathsBy:{starved:0, old:0, eaten:0, smitten:0, disaster:0}\\n  };\\n  for (let i=0;i<6;i++) S.hotspots.push({x:rand()*W, y:rand()*H, vx:randn()*0.08, vy:randn()*0.08, r:110+rand()*130});\\n  defaultWalls();\\n  for (let i=0;i<800;i++){ const [x,y]=plantSpot(); addPlant(x,y,5+rand()*25); }\\n  for (let i=0;i<130;i++) spawnCreature(0.08 + rand()*0.1);\\n  for (let i=0;i<14;i++) spawnCreature(0.85 + rand()*0.1);\\n  S.births = 0; S.fx.length = 0;\\n  logEvent('World created with seed \\\"'+seed+'\\\"');\\n  if (typeof onWorldReset === 'function') onWorldReset();\\n}\\n\\nfunction plantSpot(){\\n  if (rand()<0.72 && S.hotspots.length){\\n    const h = S.hotspots[(rand()*S.hotspots.length)|0];\\n    return [clamp(h.x + randn()*h.r*0.6, 2, W-2), clamp(h.y + randn()*h.r*0.6, 2, H-2)];\\n  }\\n  return [rand()*W, rand()*H];\\n}\\n\\n/* ===================== EVENTS ===================== */\\nconst EVENTS = {\\n  drought: {name:'Drought', icon:'☀️', dur:900, growth:0.18, temp:0.3, col:'#d9a441'},\\n  bloom:   {name:'Bloom', icon:'🌸', dur:400, growth:2.4, temp:0.05, col:'#f0abfc', start(){ for(let i=0;i<380;i++){ const [x,y]=plantSpot(); addPlant(x,y,10+rand()*20);} }},\\n  coldsnap:{name:'Cold Snap', icon:'❄️', dur:650, growth:0.45, temp:-0.95, col:'#93c5fd'},\\n  heatwave:{name:'Heatwave', icon:'🔥', dur:600, growth:0.7, temp:0.85, col:'#fb923c'},\\n  meteor:  {name:'Meteor Strike', icon:'☄️', dur:150, growth:0.9, temp:0.1, col:'#fca5a5', start(){\\n    const [x,y] = freeSpot(); const R = 170;\\n    let k=0; for (const c of S.creatures){ if(!c.dead && (c.x-x)**2+(c.y-y)**2 < R*R){ kill(c,'disaster'); k++; } }\\n    for (const p of S.plants){ if ((p.x-x)**2+(p.y-y)**2 < R*R) p.e = 0; }\\n    fx('meteor', x, y, R);\\n    logEvent('Meteor killed '+k+' creatures');\\n  }},\\n  plague:  {name:'Plague', icon:'🦠', dur:400, growth:1, temp:0, col:'#a3e635'}\\n};\\nfunction triggerEvent(key){\\n  const e = EVENTS[key];\\n  S.env.event = key; S.env.eventLeft = e.dur;\\n  if (e.start) e.start();\\n  logEvent(e.icon+' <b>'+e.name+'<\\/b> began');\\n}\\nlet logDirty = true;\\nfunction logEvent(msg){ S.log.unshift({t:S.t, msg}); if (S.log.length>30) S.log.pop(); logDirty = true; }\\n\\nfunction kill(c, cause){\\n  if (c.dead) return;\\n  c.dead = true; c.cause = cause; S.deaths++; S.deathsBy[cause] = (S.deathsBy[cause]||0)+1;\\n  fx('death', c.x, c.y, c, cause);\\n  if (cause!=='eaten' && rand()<0.5) addPlant(c.x + randn()*8, c.y + randn()*8, 4 + c.r);\\n}\\n\\n/* ===================== SPATIAL HASH ===================== */\\nfunction rebuildGrid(grid, items){\\n  for (let i=0;i<grid.length;i++) grid[i].length = 0;\\n  for (const it of items){\\n    const gx = clamp((it.x/CS)|0, 0, HGW-1), gy = clamp((it.y/CS)|0, 0, HGH-1);\\n    grid[gy*HGW+gx].push(it);\\n  }\\n}\\nlet lastD2 = 0;\\nfunction nearestPlant(x,y,range){\\n  const r2 = range*range; let best=null, bd=r2;\\n  const x0=Math.max(0,((x-range)/CS)|0), x1=Math.min(HGW-1,((x+range)/CS)|0);\\n  const y0=Math.max(0,((y-range)/CS)|0), y1=Math.min(HGH-1,((y+range)/CS)|0);\\n  for (let gy=y0;gy<=y1;gy++) for (let gx=x0;gx<=x1;gx++){\\n    const b = pGrid[gy*HGW+gx];\\n    for (let i=0;i<b.length;i++){ const p=b[i]; if (p.e<0.5) continue; const dx=p.x-x, dy=p.y-y, d=dx*dx+dy*dy; if (d<bd){bd=d;best=p;} }\\n  }\\n  lastD2 = bd; return best;\\n}\\nfunction nearestCreature(c,range){\\n  const x=c.x,y=c.y, r2 = range*range; let best=null, bd=r2;\\n  const x0=Math.max(0,((x-range)/CS)|0), x1=Math.min(HGW-1,((x+range)/CS)|0);\\n  const y0=Math.max(0,((y-range)/CS)|0), y1=Math.min(HGH-1,((y+range)/CS)|0);\\n  for (let gy=y0;gy<=y1;gy++) for (let gx=x0;gx<=x1;gx++){\\n    const b = cGrid[gy*HGW+gx];\\n    for (let i=0;i<b.length;i++){ const o=b[i]; if (o===c||o.dead||(c.pred&&o.pred&&o.lineage===c.lineage)) continue; const dx=o.x-x, dy=o.y-y, d=dx*dx+dy*dy; if (d<bd){bd=d;best=o;} }\\n  }\\n  lastD2 = bd; return best;\\n}\\nfunction findMate(c){\\n  const x=c.x,y=c.y, R=60;\\n  const x0=Math.max(0,((x-R)/CS)|0), x1=Math.min(HGW-1,((x+R)/CS)|0);\\n  const y0=Math.max(0,((y-R)/CS)|0), y1=Math.min(HGH-1,((y+R)/CS)|0);\\n  let best=null, bd=0.45;\\n  for (let gy=y0;gy<=y1;gy++) for (let gx=x0;gx<=x1;gx++){\\n    for (const o of cGrid[gy*HGW+gx]){\\n      if (o===c||o.dead||o.age<o.maturity) continue;\\n      if ((o.x-x)**2+(o.y-y)**2 > R*R) continue;\\n      const d = genomeDist(c.g,o.g); if (d<bd){bd=d;best=o;}\\n    }\\n  }\\n  return best;\\n}\\n\\n/* ===================== SIMULATION TICK ===================== */\\nfunction updateEnv(){\\n  const E = S.env;\\n  const ph = (S.t % YEAR)/YEAR;\\n  E.season = (ph*4)|0; E.year = 1 + Math.floor(S.t/YEAR); E.phase = ph;\\n  // day/night: sun up ~60% of the day; daylight eases 0..1\\n  const dp = (S.t % DAY)/DAY; E.dayPhase = dp;\\n  const sun = Math.sin(dp*2*Math.PI);\\n  E.daylight = CFG.dayNight ? clamp(0.5 + sun*1.4, 0, 1) : 1;\\n  let temp = Math.cos((ph-0.375)*2*Math.PI)*0.7 + (CFG.dayNight ? sun*0.08 : 0);\\n  let growth = Math.max(0.22, 0.68 + 0.48*Math.cos((ph-0.22)*2*Math.PI));\\n  if (E.event){\\n    const ev = EVENTS[E.event];\\n    temp += ev.temp; growth *= ev.growth;\\n    if (--E.eventLeft <= 0){ logEvent(ev.icon+' '+ev.name+' ended'); E.event = null; }\\n  } else if (rand() < 1/3200){\\n    const keys = ['drought','bloom','coldsnap','heatwave','meteor','plague'];\\n    triggerEvent(keys[(rand()*keys.length)|0]);\\n  }\\n  E.temp = clamp(temp,-1.2,1.2);\\n  E.growth = growth;\\n  for (const h of S.hotspots){\\n    h.x += h.vx; h.y += h.vy;\\n    if (h.x<0||h.x>W) h.vx*=-1; if (h.y<0||h.y>H) h.vy*=-1;\\n    h.vx += randn()*0.004; h.vy += randn()*0.004; h.vx=clamp(h.vx,-0.25,0.25); h.vy=clamp(h.vy,-0.25,0.25);\\n  }\\n}\\nfunction growPlants(){\\n  const g = S.env.growth * CFG.food;\\n  const ge = 0.045*g;\\n  for (const p of S.plants){ if (p.e < PLANT_MAX_E) p.e = Math.min(PLANT_MAX_E, p.e + ge); }\\n  S.plantAcc += 2.4 * g;\\n  while (S.plantAcc >= 1){ S.plantAcc -= 1; const [x,y]=plantSpot(); addPlant(x,y,4); }\\n  if (S.env.event==='drought'){ for (const p of S.plants) if (rand()<0.002) p.e = 0; }\\n}\\n\\nfunction stepCreature(c){\\n  const g = c.g, E = S.env;\\n  const vis = g.vision * (0.72 + 0.28*E.daylight);   // harder to see at night\\n  const inp = c.inp, ca = Math.cos(c.a), sa = Math.sin(c.a);\\n  const food = nearestPlant(c.x, c.y, vis); const fd2 = lastD2;\\n  if (food){ const dx=food.x-c.x, dy=food.y-c.y, d=Math.sqrt(fd2)||1; inp[0]=(-dx*sa+dy*ca)/d; inp[1]=(dx*ca+dy*sa)/d; inp[2]=1-d/vis; }\\n  else { inp[0]=0; inp[1]=0; inp[2]=0; }\\n  const o = nearestCreature(c, vis); const od2 = lastD2;\\n  if (o){ const dx=o.x-c.x, dy=o.y-c.y, d=Math.sqrt(od2)||1; inp[3]=(-dx*sa+dy*ca)/d; inp[4]=(dx*ca+dy*sa)/d; inp[5]=1-d/vis;\\n    inp[6]=clamp((o.r-c.r)/c.r,-1,1); inp[7]=inp[3]*clamp((o.g.diet-g.diet)*1.5,-1,1)*(0.5+inp[5]); }\\n  else { inp[3]=inp[4]=inp[5]=inp[6]=inp[7]=0; }\\n  inp[8] = c.energy/c.maxE;\\n  inp[9] = E.temp;\\n  const look = Math.min(60, g.vision*0.5);\\n  inp[10] = isWall(c.x+ca*look, c.y+sa*look) ? 1 : (isWall(c.x+ca*look*0.5, c.y+sa*look*0.5) ? 1 : 0);\\n  inp[11] = Math.sin(c.age*0.06 + c.id);\\n  c.food = food; c.target = o;\\n  forward(c.w, inp, c.hid, c.out);\\n  const out = c.out;\\n  c.a += out[0]*0.2;\\n  const tv = (out[1]+1)*0.5*c.maxSpeed;\\n  c.v += (tv - c.v)*0.25;\\n  const nx = c.x + Math.cos(c.a)*c.v, ny = c.y + Math.sin(c.a)*c.v;\\n  if (isWall(nx,ny)){ c.a += Math.PI*(0.6+rand()*0.8); c.v *= 0.3; }\\n  else { c.x = nx; c.y = ny; }\\n  c.phase += 0.12 + c.v*0.22;\\n  const sz = g.size;\\n  let cost = (0.03 + 0.0012*sz*sz) * g.metab * (0.75 + 0.25*g.lifespan);\\n  cost += 0.0018 * c.v*c.v * sz;\\n  cost += 0.00012 * g.vision;\\n  const T = E.temp, sf = Math.sqrt(8/sz);\\n  cost += (Math.max(0,-T)*(1-g.coat) + Math.max(0,T)*g.coat*0.8) * 0.085 * sf;\\n  c.attacking = 0;\\n  if (food && c.plantEff>0.02 && fd2 < (c.r+4)*(c.r+4)){\\n    const bite = Math.min(food.e, 1.5 + sz*0.3);\\n    food.e -= bite; c.energy += bite * c.plantEff * 2.2;\\n    if (c.ate<=0) fx('eat', food.x, food.y, c);\\n    c.ate = 8;\\n  }\\n  if (out[2] > 0){\\n    cost += 0.004*sz*out[2];\\n    c.attacking = out[2];\\n    if (o && od2 < (c.r+o.r+5)*(c.r+o.r+5)){\\n      const dmg = sz * (0.25 + g.diet) * 0.9 * out[2] * (0.12 + 0.88*c.meatEff);\\n      o.hp -= dmg * (o.r < c.r ? 1.2 : 0.7) * (o.pred && c.pred ? (o.lineage===c.lineage ? 0 : 0.25) : 1);\\n      if (dmg>0.5) o.hurt = 6;\\n      if (o.hp <= 0 && !o.dead){\\n        kill(o,'eaten'); c.kills++;\\n        c.energy += (o.energy*0.7 + o.g.size*o.g.size*2.0) * c.meatEff;\\n        c.ate = 12;\\n      }\\n    }\\n  }\\n  if (c.energy > c.maxE) c.energy = c.maxE;\\n  c.energy -= cost;\\n  c.hp = Math.min(c.maxHp, c.hp + 0.05);\\n  c.age++; if (c.cool>0) c.cool--; if (c.ate>0) c.ate--; if (c.hurt>0) c.hurt--;\\n  if (E.event==='plague'){\\n    const b = cGrid[clamp((c.y/CS)|0,0,HGH-1)*HGW + clamp((c.x/CS)|0,0,HGW-1)].length;\\n    if (rand() < 0.0005*Math.max(0,b-3)) { kill(c,'disaster'); return; }\\n  }\\n  if (c.energy <= 0){ kill(c,'starved'); return; }\\n  if (c.age > c.maxAge){ kill(c,'old'); return; }\\n  if (c.age > c.maturity && c.cool===0 && c.energy > g.repro*c.maxE && S.creatures.length + S.newborn.length < CFG.maxPop){\\n    let cg, cw;\\n    const mate = CFG.sexual ? findMate(c) : null;\\n    if (mate){ const x = crossover(c.g,c.w,mate.g,mate.w); cg=x.g; cw=x.w; mate.children++; }\\n    else { cg = c.g; cw = c.w; }\\n    cg = mutateGenes(cg, CFG.mut); cw = mutateBrain(cw, CFG.mut);\\n    let bx = c.x + randn()*c.r*1.5, by = c.y + randn()*c.r*1.5;\\n    if (isWall(bx,by)){ bx=c.x; by=c.y; }\\n    const kid = new Creature(cg, cw, bx, by, Math.max(c.gen, mate?mate.gen:0)+1, c.lineage);\\n    const give = c.energy*0.48;\\n    c.energy -= give*1.08; kid.energy = Math.min(kid.maxE, give);\\n    c.children++; c.cool = 200;\\n    S.newborn.push(kid); S.births++;\\n    fx('birth', bx, by, kid);\\n    if (kid.gen > S.maxGen) S.maxGen = kid.gen;\\n  }\\n}\\n\\nfunction speciesCount(){\\n  const leaders = []; const counts = [];\\n  const cs = S.creatures; const step = Math.max(1, Math.floor(cs.length/400));\\n  for (let i=0;i<cs.length;i+=step){\\n    const c = cs[i]; let found=-1;\\n    for (let j=0;j<leaders.length;j++){ if (genomeDist(c.g, leaders[j].g) < 0.4){ found=j; break; } }\\n    if (found<0){ leaders.push(c); counts.push(1); } else counts[found]++;\\n  }\\n  return counts.filter(n=>n>=3).length;\\n}\\n\\nfunction tick(){\\n  S.t++;\\n  updateEnv();\\n  growPlants();\\n  rebuildGrid(pGrid, S.plants);\\n  rebuildGrid(cGrid, S.creatures);\\n  S.newborn = [];\\n  const cs = S.creatures;\\n  for (let i=0;i<cs.length;i++){ const c=cs[i]; if (!c.dead) stepCreature(c); }\\n  for (const c of cs){\\n    if (c.age > S.oldestEver.age){ S.oldestEver = {name:c.name, age:c.age, id:c.id}; }\\n    if (c.children > S.bestEver.children){ S.bestEver = {name:c.name, children:c.children, id:c.id}; }\\n  }\\n  S.creatures = cs.filter(c=>!c.dead).concat(S.newborn);\\n  if (S.t % 4 === 0) S.plants = S.plants.filter(p=>p.e>=0.5);\\n  if (CFG.respawn && S.t % 20 === 0){\\n    let h=0,p=0; for (const c of S.creatures){ if (c.pred) p++; else h++; }\\n    if (h < 6){ for (let i=0;i<12;i++) spawnCreature(0.08+rand()*0.12); S.extinctions++; logEvent('Herbivores nearly extinct — 12 migrants arrived'); }\\n    if (p < 2 && h > 60 && S.t % 600 === 0){ for (let i=0;i<5;i++) spawnCreature(0.85+rand()*0.1); logEvent('Predators wandered in (5 migrants)'); }\\n  }\\n  if (S.t % S.histEvery === 0) recordStats();\\n  if (S.t % 90 === 0) S.species = speciesCount();\\n}\\n\\nfunction recordStats(){\\n  let h=0,p=0; const sum = {speed:0,size:0,vision:0,diet:0,coat:0,metab:0};\\n  for (const c of S.creatures){ if (c.pred) p++; else h++; for (const k in sum) sum[k]+=gnorm(c.g,k); }\\n  const n = Math.max(1,S.creatures.length);\\n  const rec = {t:S.t, h, p, pl:S.plants.length};\\n  for (const k in sum) rec[k] = sum[k]/n;\\n  S.hist.push(rec);\\n  if (S.hist.length > 700){ S.hist = S.hist.filter((_,i)=>i%2===0); S.histEvery *= 2; }\\n}\\n\\n<\\/script>\\n<script>\\n/* js/fx.js */\\n/* Particle system + visual-only effects (weather, ghosts, shake). Renderer agnostic. */\\n'use strict';\\nconst PMAX = 9000;\\nconst P = {\\n  n:0, x:new Float32Array(PMAX), y:new Float32Array(PMAX), vx:new Float32Array(PMAX), vy:new Float32Array(PMAX),\\n  life:new Float32Array(PMAX), max:new Float32Array(PMAX), size:new Float32Array(PMAX), grow:new Float32Array(PMAX),\\n  r:new Float32Array(PMAX), g:new Float32Array(PMAX), b:new Float32Array(PMAX), a:new Float32Array(PMAX),\\n  type:new Uint8Array(PMAX), add:new Uint8Array(PMAX), rot:new Float32Array(PMAX), vr:new Float32Array(PMAX),\\n  drag:new Float32Array(PMAX), grav:new Float32Array(PMAX)\\n};\\n// types: 0 glow, 1 ring, 2 leaf, 3 rain streak, 4 snow, 5 smoke, 6 spark streak, 7 firefly\\nconst VFX = { ghosts:[], shake:0, flash:0, flashCol:[1,0.8,0.6], scorch:[] };\\nfunction emit(type,x,y,vx,vy,life,size,r,g,b,a,add,opt){\\n  let i = P.n;\\n  if (i >= PMAX) { i = (Math.random()*PMAX)|0; } else P.n++;\\n  P.type[i]=type; P.x[i]=x; P.y[i]=y; P.vx[i]=vx; P.vy[i]=vy; P.life[i]=0; P.max[i]=life; P.size[i]=size;\\n  P.r[i]=r; P.g[i]=g; P.b[i]=b; P.a[i]=a; P.add[i]=add?1:0;\\n  P.rot[i]= opt&&opt.rot!==undefined?opt.rot:Math.random()*6.283; P.vr[i]=opt&&opt.vr||0; P.drag[i]=opt&&opt.drag!==undefined?opt.drag:0.96;\\n  P.grow[i]=opt&&opt.grow||0; P.grav[i]=opt&&opt.grav||0;\\n}\\nconst splashes = [];\\nfunction updateParticles(dt){\\n  splashes.length = 0;\\n  let n = P.n;\\n  for (let i=0;i<n;i++){\\n    P.life[i] += dt;\\n    if (P.life[i] >= P.max[i]){\\n      // rain hits the ground → tiny splash ring\\n      if (P.type[i]===3 && Math.random()<0.5) splashes.push(P.x[i], P.y[i]);\\n      n--; copyP(n,i); i--; continue;\\n    }\\n    const d = Math.pow(P.drag[i], dt);\\n    P.vx[i]*=d; P.vy[i]=P.vy[i]*d + P.grav[i]*dt;\\n    P.x[i]+=P.vx[i]*dt; P.y[i]+=P.vy[i]*dt; P.rot[i]+=P.vr[i]*dt; P.size[i]+=P.grow[i]*dt;\\n    if (P.type[i]===4){ P.vx[i] += Math.sin(P.life[i]*0.08 + i)*0.02*dt; }\\n    if (P.type[i]===7){ P.vx[i] += (Math.random()-0.5)*0.08*dt; P.vy[i] += (Math.random()-0.5)*0.08*dt; }\\n  }\\n  P.n = n;\\n  for (let i=0;i<splashes.length;i+=2) emit(1,splashes[i],splashes[i+1],0,0,14,2.5,0.75,0.85,1,0.35,1,{grow:0.35});\\n}\\nfunction copyP(from,to){ for (const k in P){ if (k!=='n') P[k][to]=P[k][from]; } }\\n\\nfunction onWorldReset(){ P.n = 0; VFX.ghosts.length = 0; VFX.scorch.length = 0; }\\n\\nfunction consumeSimFx(maxPerFrame){\\n  const q = S.fx; const n = q.length; const keep = n > maxPerFrame ? maxPerFrame/n : 1;\\n  for (let k=0; k<n; k++){\\n    const e = q[k];\\n    if (keep < 1 && e.type !== 'meteor' && e.type !== 'death' && Math.random() > keep) continue;\\n    if (e.type==='birth'){\\n      const c=e.a, [r,g,b]=c.rgb;\\n      for (let i=0;i<9;i++){ const a=Math.random()*6.283, s=0.4+Math.random()*1.4; emit(0,e.x,e.y,Math.cos(a)*s,Math.sin(a)*s,30+Math.random()*25,1.6+Math.random()*2.2, i%3?r*0.6+0.4:1, i%3?g*0.6+0.4:0.95, i%3?b*0.6+0.4:0.7, 0.9, 1, {drag:0.93}); }\\n      emit(1,e.x,e.y,0,0,26,c.r*0.8,r,g,b,0.6,1,{grow:0.7});\\n    } else if (e.type==='eat'){\\n      const c=e.a; const pc = plantRGB();\\n      for (let i=0;i<3;i++){ const a=Math.random()*6.283, s=0.3+Math.random()*0.8; emit(2,e.x,e.y,Math.cos(a)*s,Math.sin(a)*s,28+Math.random()*20,1.8+Math.random()*1.4, pc[0],pc[1],pc[2],0.9,0,{vr:(Math.random()-0.5)*0.3,drag:0.92}); }\\n    } else if (e.type==='death'){\\n      const c=e.a, [r,g,b]=c.rgb;\\n      VFX.ghosts.push({c, t:0, max: e.b==='eaten'?22:55, x:c.x, y:c.y});\\n      if (VFX.ghosts.length>200) VFX.ghosts.shift();\\n      if (e.b==='eaten'){\\n        for (let i=0;i<12;i++){ const a=Math.random()*6.283, s=0.6+Math.random()*2.2; emit(6,e.x,e.y,Math.cos(a)*s,Math.sin(a)*s,18+Math.random()*16,1.4+Math.random()*1.4,1,0.25+Math.random()*0.2,0.2,0.95,1,{drag:0.9}); }\\n        emit(1,e.x,e.y,0,0,20,c.r,1,0.35,0.3,0.7,1,{grow:1.0});\\n      } else if (e.b==='smitten'){\\n        for (let i=0;i<14;i++){ const a=Math.random()*6.283, s=0.8+Math.random()*2.5; emit(6,e.x,e.y,Math.cos(a)*s,Math.sin(a)*s,22,1.6,0.75,0.65,1,1,1,{drag:0.9}); }\\n        emit(1,e.x,e.y,0,0,24,c.r,0.8,0.7,1,0.9,1,{grow:1.6});\\n        VFX.flash = Math.max(VFX.flash, 0.12); VFX.flashCol=[0.7,0.6,1];\\n      } else {\\n        for (let i=0;i<5;i++){ dry = mix(palD(s0), palD(s1), sf);\\n  float winter = (s0==3 ? 1.0-sf : 0.0) + (s1==3 ? sf : 0.0);\\n  float e = fbm(p*0.0022);\\n  float m = fbm(p*0.0031 + 17.3);\\n  float fert = 0.0;\\n  for (int i=0;i<6;i++){ vec2 d=p-u_hot[i].xy; fert += exp(-dot(d,d)/(u_hot[i].z*u_hot[i].z*0.9)); }\\n  float lushness = clamp(m*1.25 - 0.3 + fert*0.65*min(u_growth,1.6), 0.0, 1.0);\\n  vec3 g = mix(dry, lush, lushness);\\n  float gn = vnoise(p*0.09)*0.5 + vnoise(p*0.23)*0.3 + vnoise(p*0.61)*0.2;\\n  g *= 0.84 + gn*0.3;\\n  // grass blades shimmer in wind\\n  float blade = vnoise(vec2(p.x*0.5 + sin(p.y*0.05 + u_time*0.8)*2.0, p.y*0.12));\\n  g *= 0.95 + blade*0.1*(1.0-winter);\\n  // soil / dirt patches and darker moist lowlands\\n  float dirt = smoothstep(0.6, 0.74, vnoise(p*0.006+3.0)*0.6 + e*0.5);\\n  g = mix(g, vec3(0.30,0.23,0.15)*(0.85+gn*0.3), dirt*0.55*(1.0-lushness*0.5)*(1.0-winter*0.7));\\n  float low = smoothstep(0.42, 0.3, e);\\n  g = mix(g, g*vec3(0.75,0.85,0.95), low*0.5);\\n  // wet ground sheen during rain\\n  g *= 1.0 - u_wet*0.12; g += u_wet*0.04*vec3(0.5,0.6,0.8)*smoothstep(0.5,0.8,vnoise(p*0.02));\\n  // drought: parched + cracked earth\\n  if (u_drought > 0.001){\\n    g = mix(g, vec3(0.64,0.53,0.31)*(0.88+gn*0.25), u_drought*0.65);\\n    vec2 cp = p*0.045; float cr = abs(vnoise(cp)-vnoise(cp*1.9+4.0));\\n    g *= 1.0 - u_drought*0.45*smoothstep(0.05, 0.0, cr);\\n  }\\n  // frost / snow cover\\n  float snow = max(u_frost, winter*0.55);\\n  g = mix(g, vec3(0.86,0.91,0.98)*(0.93+gn*0.09), snow*smoothstep(0.25, 0.75, vnoise(p*0.012)*0.8 + snow*0.5));\\n  // meteor scorch marks\\n  for (int i=0;i<4;i++){ vec4 sc = u_scorch[i]; if (sc.z <= 0.0) continue; float d = length(p-sc.xy)/sc.z;\\n    float k = smoothstep(1.0, 0.2, d + (vnoise(p*0.04)-0.5)*0.35) * sc.w; g = mix(g, vec3(0.08,0.06,0.05), k*0.85);\\n    g += vec3(1.0,0.35,0.05)*smoothstep(0.35,0.0,d)*sc.w*sc.w*0.8; }\\n  // rock ridges (walls) with lighting + cast shadow\\n  vec2 inv = vec2(1.0/2000.0, 1.0/1300 ient; uniform vec2 u_lightDir; uniform float u_glow;\\nout vec4 o;\\nfloat sdEll(vec2 p, vec2 r){ float k0=length(p/r); float k1=length(p/(r*r)); return k0*(k0-1.0)/max(k1,1e-4); }\\nfloat smin(float a,float b,float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }\\nfloat sdSeg(vec2 p, vec2 a, vec2 b, float r){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0); return length(pa-ba*h)-r; }\\nvoid main(){\\n  vec2 q = v_uv * v_ext;\\n  float ph = v_i1.z, look = v_i1.w, pred = v_p.x, en = v_p.y, att = v_p.z, hurt = v_p.w;\\n  float bend = sin(ph*0.9 - q.x*1.6) * 0.16 * clamp(0.6 - q.x, 0.0, 2.5);\\n  vec2 b = vec2(q.x, q.y - bend);\\n  float d, limbs = 1e5, eyeX, eyeY, eyeR;\\n  if (pred < 0.5){\\n    d = sdEll(b - vec2(0.0,0.0), vec2(1.1, 0.8));\\n    d = smin(d, sdEll(b - vec2(0.78,0.0), vec2(0.5,0.47)), 0.25);\\n    float tw = sin(ph*0.9 + 1.2)*0.35;\\n    vec2 t = b - vec2(-1.0, 0.0);\\n    d = smin(d, sdSeg(t, vec2(0.0), vec2(-0.7, tw), 0.12), 0.22);\\n    limbs = length(t - vec2(-0.78, tw*1.05)) - 0.27;\\n    for (int i=0;i<4;i++){\\n      float fi=float(i); float side = (i==0||i==2)?1.0:-1.0; float fx = (i<2)?0.42:-0.42;\\n      float sw = sin(ph*1.8 + fi*1.57) * 0.25;\\n      limbs = min(limbs, sdSeg(q, vec2(fx, side*0.5), vec2(fx+sw, side*1.0), 0.12));\\n    }\\n    eyeX = 0.92; eyeY = 0.27; eyeR = 0.17;\\n  } else {\\n    d = sdEll(b, vec2(1.3, 0.6));\\n    d = smin(d, sdEll(b - vec2(0.95,0.0), vec2(0.62,0.5)), 0.2);\\n    float open = att*0.45 + 0.04;\\n    vec2 m = b - vec2(1.62,0.0);\\n    float notch = max(-m.x - 0.6, abs(m.y) - (-m.x)*open);\\n    d = max(d, -notch);\\n    float tw = sin(ph*0.9+1.0)*0.42;\\n    vec2 t = b - vec2(-1.15,0.0);\\n    d = smin(d, sdSeg(t, vec2(0.0), vec2(-1.05, tw), 0.09), 0.2);\\n    limbs = sdSeg(t, vec2(-0.85, tw*0.8), vec2(-1.25, tw*1.3+0.3), 0.07);\\n    limbs = min(limbs, sdSeg(t, vec2(-0.85, tw*0.8), vec2(-1.25, tw*1.3-0.3), 0.07));\\n    for (int i=0;i<2;i++){\\n      float nconst SEASON_PLANT = [[0.38,0.86,0.42],[0.58,0.86,0.30],[0.96,0.58,0.22],[0.62,0.88,0.84]];\\nfunction atmosphere(k){\\n  const E = S.env, d = E.daylight, ev = E.event;\\n  let amb = d > 0.5 ? mix3(DUSK, DAYC, (d-0.5)*2) : mix3(NIGHT, DUSK, d*2);\\n  let grade = [1,1,1];\\n  if (ev==='drought'){ amb = [amb[0]*1.06, amb[1]*1.0, amb[2]*0.86]; grade=[1.05,1.0,0.9]; }\\n  if (ev==='coldsnap'){ amb = [amb[0]*0.95, amb[1]*0.98, amb[2]*1.05]; grade=[0.98,0.99,1.03]; }\\n  if (ev==='heatwave'){ amb = [amb[0]*1.1, amb[1]*0.96, amb[2]*0.82]; grade=[1.08,0.98,0.88]; }\\n  if (ev==='plague'){ grade=[0.95,1.05,0.9]; }\\n  if (ev==='bloom'){ grade=[1.03,1.0,1.04]; amb = [amb[0]*0.95, amb[1]*0.97, amb[2]*1.02]; }\\n  VS.amb = mix3(VS.amb, amb, k); VS.grade = mix3(VS.grade, grade, k);\\n  const winterish = E.season===3;\\n  VS.drought = approach(VS.drought, ev==='drought'?1:0, k*0.5);\\n  VS.frost = approach(VS.frost, ev==='coldsnap'?1:0, k*0.5);\\n  const rainy = ev==='bloom' || (E.season===0 && (Math.floor(S.t/DAY)%3===1));\\n  VS.wet = approach(VS.wet, rainy?1:0, k*0.4);\\n  VS.heat = approach(VS.heat, ev==='heatwave'?1:ev==='drought'?0.5:0, k*0.5);\\n  let sf = E.phase*4; if (sf - VS.seasonF < -2) VS.seasonF -= 4; VS.seasonF = approach(VS.seasonF, sf, 0.2);\\n  let pc = SEASON_PLANT[E.season]; if (ev==='drought') pc = [0.78,0.68,0.32]; if (ev==='bloom') pc=[0.45,0.95,0.5];\\n  VS.plant = mix3(VS.plant, pc, k*0.5); _plantRGB = VS.plant;\\n  const sunA = (E.dayPhase||0)*Math.PI*2; const sun = Math.sin(sunA);\\n  let lx = Math.cos(sunA), ly = -0.55 - 0.45*Math.max(0,sun); const ln = Math.hypot(lx,ly); lx/=ln; ly/=ln;\\n  if (!CFG.dayNight){ lx=-0.6; ly=-0.8; }\\n  return { ambient:VS.amb, dir:[lx,ly], shadowLen: CFG.dayNight ? 0.5 + (1-Math.max(0,sun))*1.3 : 0.8 };\\n}\\n\\n/* ---------- 2D fallback renderer ---------- */\\nfunction render2D(V){\\n  const ctx = ctx2d; const E = S.env;\\n  ctx.setTransform(dpr,0,0,dpr,0,0);\\n  ctx.fillStyle = '#05070b'; ctx.fillRect(0,0,vw,vh);\\n  ctx.save(); ctx.translate(vw/2, vh/2); ctx.scale(V.cam.z, V.cam.z); ctx.translate(-V.cam.x, -V.cam.y);\\n  const a = V.light.ambient, sp = SEASON_PLANT[E.season];\\n  ctx.fillStyle = `rgb(${(40+sp[0]*30)*a[0]|0},${(55+sp[1]*30)*a[1]|0},${(40+sp[2]*20)*a[2]|0})`; ctx.fillRect(0,0,W,H);\\n  for (const h of S.hotspots){ const g = ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,h.r*1.3); g.addColorStop(0,'rgba(90,200,110,0.15)'); g.addColorStop(1,'rgba(90,200,110,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(h.x,h.y,h.r*1.3,0,7); ctx.fill(); }\\n  ctx.fillStyle = `rgb(${VS.plant[0]*200*a[0]|0},${VS.plant[1]*200*a[1]|0},${VS.plant[2]*200*a[2]|0})`; ctx.beginPath();\\n  for (const p of S.plants){ if (p.e<0.5) continue; const r = 1.5+p.e*0.12; ctx.moveTo(p.x+r,p.y); ctx.arc(p.x,p.y,r,0,6.283); } ctx.fill();\\n  ctx.fillStyle = '#5a5550';\\n  for (let gy=0;gy<GH;gy++) for (let gx=0;gx<GW;gx++) if (walls[gy*GW+gx]) ctx.fillRect(gx*WCELL,gy*WCELL,WCELL,WCELL);\\n  for (const c of S.creatures){\\n    const r=c.r, ca=Math.cos(c.a), sa=Math.sin(c.a);\\n    ctx.fillStyle = c.col; ctx.beginPath();\\n    if (c.pred){ ctx.moveTo(c.x+ca*r*1.6,c.y+sa*r*1.6); ctx.lineTo(c.x-ca*r*0.9-sa*r,c.y-sa*r*0.9+ca*r); ctx.lineTo(c.x-ca*r*0.4,c.y-sa*r*0.4); ctx.lineTo(c.x-ca*r*0.9+sa*r,c.y-sa*r*0.9-ca*r); ctx.closePath(); }\\n    else ctx.ellipse(c.x,c.y,r*1.15,r*0.85,c.a,0,6.283);\\n    ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(c.x+ca*r*0.75,c.y+sa*r*0.75,Math.max(0.9,r*0.22),0,6.283); ctx.fill();\\n  }\\n  ctx.globalCompositeOperation='lighter';\\n  for (let i=0;i<P.n;i++){ const k=P.life[i]/P.max[i]; ctx.fillStyle=`rgba(${P.r[i]*255|0},${P.g[i]*255|0},${P.b[i]*255|0},${P.a[i]*(1-k)*0.8})`; ctx.fillRect(P.x[i]-P.size[i]*0.5,P.y[i]-P.size[i]*0.5,P.size[i],P.size[i]); }\\n  ctx.globalCompositeOperation='source-over';\\n  ctx.restore();\\n}\\n\\n/* ---------- overlay (selection, vision, brush) ---------- */\\nfunction drawOverlay(V, now){\\n  octx.setTransform(dpr,0,0,dpr,0,0); octx.clearRect(0,0,vw,vh);\\n  octx.save(); octx.translate(vw/2, vh/2); octx.scale(V.cam.z, V.cam.z); octx.translate(-V.cam.x, -V.cam.y);\\n  const lw = 1/V.cam.z;\\n  if (OPT.vision){ octx.strokeStyle='rgba(255,255,255,0.07)'; octx.lineWidth=lw; octx.beginPath(); for (const c of S.creatures){ octx.moveTo(c.x+c.g.vision,c.y); octx.arc(c.x,c.y,c.g.vision,0,6.2832);} octx.stroke(); }\\n  if (selected && !selected.dead){\\n    const c = selected, vis = c.g.vision*(0.72+0.28*S.env.daylight);\\n    const grd = octx.createRadialGradient(c.x,c.y,vis*0.2,c.x,c.y,vis); grd.addColorStop(0,'rgba(253,230,138,0.0)'); grd.addColorStop(1,'rgba(253,230,138,0.07)');\\n    octx.fillStyle = grd; octx.beginPath(); octx.arc(c.x,c.y,vis,0,6.2832); octx.fill();\\n    octx.strokeStyle='rgba(253,230,138,0.35)'; octx.lineWidth=1.2*lw; octx.setLineDash([6*lw,6*lw]); octx.lineDashOffset = -now*0.02*lw; octx.stroke(); octx.setLineDash([]);\\n    if (c.food && c.food.e>0.5){ octx.strokeStyle='rgba(134,239,172,0.7)'; octx.lineWidth=1.5*lw; octx.beginPath(); octx.moveTo(c.x,c.y); octx.lineTo(c.food.x,c.food.y); octx.stroke(); }\\n    if (c.target && !c.target.dead){ octx.strokeStyle= c.pred ? 'rgba(248,113,113,0.8)' : 'rgba(147,197,253,0.6)'; octx.lineWidth=1.5*lw; octx.setLineDash([4*lw,4*lw]); octx.beginPath(); octx.moveTo(c.x,c.y); octx.lineTo(c.target.x,c.target.y); octx.stroke(); octx.setLineDash([]); }\\n    const pulse = 1 + 0.12*Math.sin(now/170);\\n    octx.strokeStyle='rgba(253,230,138,0.95)'; octx.lineWidth=2*lw; octx.shadowColor='rgba(253,230,138,0.8)'; octx.shadowBlur=10;\\n    octx.beginPath(); octx.arc(c.x,c.y,(c.r*2.0+5)*pulse,0,6.2832); octx.stroke(); octx.shadowBlur=0;\\n    // name tag\\n    octx.font = `${12*lw}px system-ui`; octx.textAlign='center';\\n    const label = c.name + (c.pred?' 🐺':' 🐇');\\n    const tw = octx.measureText(label).width + 12*lw, ty = c.y - c.r*2.4 - 14*lw;\\n    octx.fillStyle='rgba(10,14,22,0.7)'; roundRect(octx, c.x-tw/2, ty-11*lw, tw, 16*lw, 6*lw); octx.fill();\\n    octx.fillStyle='#fde68a'; octx.fillText(label, c.x, ty+1*lw);\\n    const ef = clamp(c.energy/c.maxE,0,1); octx.fillStyle='rgba(10,14,22,0.7)'; octx.fillRect(c.x-14*lw, ty+7*lw, 28*lw, 3*lw); octx.fillStyle='#fbbf24'; octx.fillRect(c.x-14*lw, ty+7*lw, 28*lw*ef, 3*lw);\\n  }\\n  if (mouse.inside && tool!=='inspect' && !isTouch){\\n    octx.strokeStyle = {food:'#86efac',herb:'#4ade80',pred:'#f87171',smite:'#c4b5fd',wall:'#cbd5e1',erase:'#fbbf24'}[tool];\\n    octx.lineWidth = 1.5*lw; octx.setLineDash([5*lw,4*lw]);\\n    const rr = (tool==='herb'||tool==='pred') ? 10 : brush;\\n    octx.beginPath(); octx.arc(mouse.wx, mouse.wy, rr, 0, 6.2832); octx.stroke(); octx.setLineDash([]);\\n  }\\n  octx.restore();\\n}\\nfunction roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }\\n\\n/* ---------- minimap ---------- */\\nconst miniCv = $('mini'), mctx = miniCv.getContext('2d');\\nfunction drawMini(){\\n  if (!OPT.mini || !miniCv.width) return;\\n  const w = miniCv.width, h = miniCv.height, sx = w/W, sy = h/H;\\n  mctx.fillStyle = '#122016'; mctx.fillRect(0,0,w,h);\\n  for (const hs of S.hotspots){ const g = mctx.createRadialGradient(hs.x*sx,hs.y*sy,0,hs.x*sx,hs.y*sy,hs.r*sx*1.3); g.addColorStop(0,'rgba(80,190,100,0.35)'); g.addColorStop(1,'rgba(80,190,100,0)'); mctx.fillStyle=g; mctx.fillRect(0,0,w,h); }\\n  mctx.fillStyle = '#6b665f';\\n  for (let gy=0;gy<GH;gy++) for (let gx=0;gx<GW;gx++) if (walls[gy*GW+gx]) mctx.fillRect(gx*WCELL*sx, gy*WCELL*sy, WCELL*sx+0.5, WCELL*sy+0.5);\\n  for (const c of S.creatures){ mctx.fillStyle = c.pred ? '#f87171' : '#86efac'; const s = c.pred?2.5*dpr:1.6*dpr; mctx.fillRect(c.x*sx-s/2, c.y*sy-s/2, s, s); }\\n  const x0 = (cam.x - vw/2/cam.z)*sx, y0 = (cam.y - vh/2/cam.z)*sy;\\n  mctx.strokeStyle = 'rgba(255,255,255,0.8)'; mctx.lineWidth = 1.2*dpr; mctx.strokeRect(x0, y0, vw/cam.z*sx, vh/cam.z*sy);\\n}\\n$('minimap').addEventListener('pointerdown', e=>{ const r = miniCv.getBoundingClientRect(); camT.x = (e.clientX-r.left)/r.width*W; camT.y = (e.clientY-r.top)/r.height*H; following=false; updateFollowBtn(); e.stopPropagation(); });\\n\\n/* ---------- charts / inspector / records ---------- */\\nconst TRAIT_COLS = {speed:'#60a5fa', size:'#fbbf24', vision:'#c084fc', diet:'#f87171', coat:'#e2e8f0', metab:'#34d399'};\\n$('traitlegend').innerHTML = Object.keys(TRAIT_COLS).map(k=>`<span><i style=\\\"background:${TRAIT_COLS[k]}\\\"><\\/i>${GLABEL[k]}<\\/span>`).join('');\\nfunction drawChart(id, series, maxOverride){\\n  const c = $(id), g = c.getContext('2d');\\n  const w = c.width, h = c.height; g.clearRect(0,0,w,h);\\n  const hist = S.hist; if (hist.length<2 || !w) return;\\n  g.strokeStyle='rgba(255,255,255,0.05)'; g.lineWidth=1;\\n  for (let i=1;i<4;i++){ g.beginPath(); g.moveTo(0,h*i/4); g.lineTo(w,h*i/4); g.stroke(); }\\n  const t0 = hist[0].t, t1 = hist[hist.length-1].t, span = Math.max(1,t1-t0);\\n  for (let yr = Math.floor(t0/YEAR)*YEAR; yr < t1; yr += YEAR){\\n    const xs = (yr+YEAR*0.75 - t0)/span*w, xe = (yr+YEAR - t0)/span*w;\\n    g.fillStyle='rgba(147,197,253,0.07)'; g.fillRect(xs,0,xe-xs,h);\\n  }\\n  let max = maxOverride || 1;\\n  if (!maxOverride) for (const s of series){ if (s.own) continue; for (const r of hist) max = Math.max(max, r[s.k]); }\\n  for (const s of series){\\n    let m = max; if (s.own){ m=1; for (const r of hist) m=Math.max(m,r[s.k]); }\\n    const pts = hist.map(r=>[(r.t-t0)/span*w, h - 3*dpr - (r[s.k]/m)*(h-8*dpr)]);\\n    if (s.fill){ const gr = g.createLinearGradient(0,0,0,h); gr.addColorStop(0, s.fill); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.beginPath(); g.moveTo(pts[0][0],h); pts.forEach(p=>g.lineTo(p[0],p[1])); g.lineTo(pts[pts.length-1][0],h); g.closePath(); g.fill(); }\\n    g.strokeStyle = s.col; g.lineWidth = (s.w||1.7)*dpr; g.lineJoin='round'; g.beginPath();\\n    pts.forEach((p,i)=> i?g.lineTo(p[0],p[1]):g.moveTo(p[0], ball.r&&ball.x<b.x+b.w+ball.r&&ball.y>b.y-ball.r&&ball.y<b.y+b.h+ball.r){b.a=false;ball.vy*=-1;score+=10;break}\\n  if(ball.y>H+20){lives--;if(lives>0)reset(false)}\\n  if(bricks.every(b=>!b.a)){level++;bricks=bricksFor(level);const s=1.12;ball.vx*=s;ball.vy*=s;stuck=true}\\n }\\n hud();\\n x.clearRect(0,0,W,H);for(const b of bricks)if(b.a){x.fillStyle=b.c;x.beginPath();x.roundRect(b.x,b.y,b.w,b.h,5);x.fill()}\\n x.fillStyle='#fff';x.beginPath();x.roundRect(pad.x,H-30,pad.w,10,5);x.fill();\\n x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fillStyle='#ffe066';x.fill();\\n if(lives<=0){x.fillStyle='#000a';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='bold 28px system-ui';x.textAlign='center';x.fillText('Game over',W/2,H/2);x.font='16px system-ui';x.fillText('Click to play again',W/2,H/2+28)}\\n requestAnimationFrame(step)}\\nconst launch=()=>{if(lives<=0){reset(true);return}stuck=false};\\nconst mv=e=>{const r=cv.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX);pad.x=(cx-r.left)*(W/r.width)-pad.w/2};\\ncv.addEventListener('mousemove',mv);cv.addEventListener('touchmove',e=>{e.preventDefault();mv(e)},{passive:false});cv.addEventListener('click',launch);cv.addEventListener('touchstart',launch);\\naddEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();launch()}});addEventListener('keyup',e=>keys[e.key]=false);\\nwindow.__brick={get state(){return{score,lives,stuck,bricks:bricks.filter(b=>b.a).length}}};\\nstep();\\n<\\/script><\\/body><\\/html>\\n\"}, {\"key\": \"sketch\", \"name\": \"Doodle Pad\", \"author\": \"Waffle\", \"cat\": \"Creative\", \"emoji\": \"🖍️\", \"color\": \"#ffe7a3\", \"desc\": \"Draw with colors, brush sizes, undo, and save as PNG.\", \"code\": \"<!DOCTYPE html><html><head><meta charset=\\\"utf-8\\\"><meta name=\\\"viewport\\\" content=\\\"width=device-width,initial-scale=1\\\"><title>Doodle Pad<\\/title>\\n<style>*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:colu /* ============ App file bridge (postMessage) — Moneyman's proposal, reviewed and adapted by jeff ============
   Lets sandboxed app windows list/read/write files in the user folders, after the user allows it once per app and folder.
   Requests carry a reqId that is echoed back in the reply.
     {type:'webos-fs-hello', reqId}                       -> {type:'webos-fs-ready', reqId, ok:true, version:1, roots:[...], pictures:'/Pictures'}
     {type:'webos-fs-list',  reqId, path}                 -> {type:'webos-fs-listed', reqId, ok, path, entries:[{name,path,type:'file'|'dir',size,mtime}], error?}
     {type:'webos-fs-read',  reqId, path}                 -> {type:'webos-fs-data',   reqId, ok, path, data, mtime, size, error?}
     {type:'webos-fs-write', reqId, path, data|dataUrl, overwrite:bool}
                                                          -> {type:'webos-fs-written', reqId, ok, path, error?}
   Push to windows that said hello and hold a grant:  {type:'webos-fs-changed'}  (debounced, after any FS change).
   Security rules:
   - Only the main iframe of an app window (.wbody > .fill > iframe) that is a sandboxed srcdoc frame WITHOUT allow-same-origin
     and has not navigated away from its own code. Browser, Code Runner previews, web/url apps and nested frames never match.
   - Paths are FS.norm()ed (no .. escape) and must sit inside the shared user folders; every ancestor must be a folder.
   - One consent dialog per app and folder. Built-in and installed apps are remembered in cfg.fsGrants[appId]
     (cleared on uninstall and on app update); temporary windows get it for that window only. "Don't allow" is
     remembered for that window so an app can't spam prompts.
   - Writes: strings only, at most 20 MB; never replace a folder; without overwrite:true a unique name is used. */
const FS_API={version:1,roots:['/Pictures','/Documents','/Desktop','/Music','/Projects'],maxWrite:20*1024*1024,maxPath:1024};
const FS_REPLY={'webos-fs-list':'webos-fs-listed','webos-fs-read':'webos-fs-data','webos-fs-write':'webos-fs-written'};
const FS_NO_BRIDGE=new Set(['browser','coderunner','appetite']);
const fsSessionGrants=new WeakMap(),fsDenied=new WeakMap(),fsAsking=new Map(),fsWatchers=new Map();
function fsRootOf(p){return FS_API.roots.find(r=>p===r||p.startsWith(r+'/'))||null;}
/* Find the app window whose main sandboxed srcdoc iframe sent this message, or null. */
function fsSenderWin(src){for(const w of WM.wins.values()){if(w.appId&&FS_NO_BRIDGE.has(w.appId))continue;
 for(const f of w.el.querySelectorAll('.wbody > .fill > iframe')){if(f.contentWindow!==src)continue;
  const sb=f.getAttribute('sandbox');if(sb==null||/\ballow-same-origin\b/.test(sb)||f.hasAttribute('src')||!f.hasAttribute('srcdoc'))return null;
  if(!APP_FRAMES.has(f)||APP_FRAMES.get(f)>1)return null; // not created by appCustom, or navigated away
  return{win:w,frame:f};}}return null;}
function fsGrantKey(fw){const a=fw.appId&&getApp(fw.appId);return a?fw.appId:null;} // built-in + installed apps are remembered; temp windows only for that window
function fsHasGrant(fw,root){const k=fsGrantKey(fw);if(k)return!!((cfg.fsGrants||{})[k]||[]).includes(root);return!!(fsSessionGrants.get(fw)||[]).includes(root);}
function fsAnyGrant(fw){const k=fsGrantKey(fw);return!!(k?((cfg.fsGrants||{})[k]||[]).length:(fsSessionGrants.get(fw)||[]).length);}
function fsAllow(fw,root){if(fsHasGrant(fw,root))return Promise.resolve(true);if((fsDenied.get(fw)||[]).includes(root))return Promise.resolve(false);
 const ak=(fsGrantKey(fw)||'w'+fw.id)+'|'+root;if(fsAsking.has(ak))return fsAsking.get(ak);
 const name=String(fw.title||'This app').slice(0,60);
 const p=dialog({title:'Allow file access?',body:el('div',{},el('div',{style:{display:'flex',gap:'12px',alignItems:'center',marginBottom:'8px'}},tileEl(fw.app||{icon:fw.icon||'📦'},'sm'),el('b',{},name)),
   el('p',{style:{lineHeight:1.5,margin:'6px 0'}},`“${name}” wants to view and save files in your ${root.slice(1)} folder.`),el('p',{class:'muted',style:{fontSize:'12px',margin:'6px 0'}},'It can’t see any other folder. You can revoke this in Settings › Advanced.')),
  buttons:[{label:'Don’t allow',value:false},{label:'Allow',primary:true,value:true}]}).then(ok=>{fsAsking.delete(ak);
  if(!ok){fsDenied.set(fw,[...(fsDenied.get(fw)||[]),root]);return false;}
  if(!WM.wins.has(fw.id))return false;const k=fsGrantKey(fw);
  if(k){cfg.fsGrants=cfg.fsGrants||{};cfg.fsGrants[k]=[...new Set([...(cfg.fsGrants[k]||[]),root])];saveCfgNow();}else fsSessionGrants.set(fw,[...(fsSessionGrants.get(fw)||[]),root]);return true;});
 fsAsking.set(ak,p);return p;}
const fsNotify=debounce(()=>{for(const[src,fw]of fsWatchers){if(!WM.wins.has(fw.id)||!fsSenderWin(src)){fsWatchers.delete(src);continue}if(!fsAnyGrant(fw))continue;try{src.postMessage({type:'webos-fs-changed'},'*')}catch(_){fsWatchers.delete(src)}}},250);
on('fs',fsNotify);
window.addEventListener('message',async e=>{const d=e.data;if(!d||typeof d!=='object'||typeof d.type!=='string'||!d.type.startsWith('webos-fs-'))return;
 const src=e.source;if(!src||src===window)return;
 const hit=fsSenderWin(src);if(!hit)return; // only sandboxed app windows, never web pages
 const fw=hit.win,reqId=typeof d.reqId==='string'||typeof d.reqId==='number'?String(d.reqId).slice(0,100):undefined;
 const reply=m=>{if(!WM.wins.has(fw.id)||hit.frame.contentWindow!==src||(APP_FRAMES.get(hit.frame)||0)>1)return;try{src.postMessage({reqId,...m},'*')}catch(_){}};
 if(d.type==='webos-fs-hello'){fsWatchers.set(src,fw);return reply({type:'webos-fs-ready',ok:true,version:FS_API.version,roots:FS_API.roots,pictures:'/Pictures'});}
 const rt=FS_REPLY[d.type];if(!rt)return;
 const raw=typeof d.path==='string'?d.path:'';const p=FS.norm(raw),root=fsRootOf(p),fail=error=>reply({type:rt,ok:false,path:p,error});
 if(raw.length>FS_API.maxPath)return fail('path too long');
 if(!root)return fail('path must be inside '+FS_API.roots.join(', '));
 if(!await fsAllow(fw,root))return fail('permission denied');
 try{
  if(d.type==='webos-fs-list'){if(!FS.exists(p)&&p===root)return reply({type:rt,ok:true,path:p,entries:[]});if(!FS.isDir(p))return fail('not a folder');
   return reply({type:rt,ok:true,path:p,entries:FS.list(p).map(n=>({name:n.name,path:n.path,type:n.t==='d'?'dir':'file',size:n.t==='f'?String(n.c||'').length:0,mtime:n.m}))});}
  if(d.type==='webos-fs-read'){const n=fsData[p];if(!n||n.t!=='f')return fail('file not found');return reply({type:rt,ok:true,path:p,data:n.c,mtime:n.m,size:String(n.c||'').length});}
  if(d.type==='webos-fs-write'){const data=typeof d.data==='string'?d.data:d.dataUrl;if(typeof data!=='string')return fail('data must be a string (text or a data: URL)');
   if(data.length>FS_API.maxWrite)return fail('file too large (max 20 MB)');if(p===root||FS.isDir(p))return fail('path is a folder');
   for(let q=FS.parent(p);q!=='/';q=FS.parent(q))if(FS.exists(q)&&!FS.isDir(q))return fail('a parent of that path is a file');
   const target=FS.exists(p)&&d.overwrite!==true?FS.unique(p):p;FS.write(target,data);return reply({type:rt,ok:true,path:target});}
 }catch(err){fail(String(err&&err.message||err))}});
</script>
